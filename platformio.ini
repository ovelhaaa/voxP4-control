; VoxP4 Control Surface - PlatformIO Configuration
; Hardware: ESP32 Cheap Yellow Display (CYD) 2-USB variant
; Reference: github.com/ovelhaaa/beatCYDa

[platformio]
default_envs = esp32-cyd
src_dir = src
include_dir = src

[env:esp32-cyd]
; Platform and board configuration
platform = espressif32@6.5.0
board = esp32dev
framework = arduino

; CPU configuration
board_build.f_flash = 40000000L
board_build.flash_mode = dio

; Build flags (consolidated)
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DLV_FONT_MONTSERRAT_10=1
    -DLV_FONT_MONTSERRAT_12=1
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_16=1
    -O2
    ; Make the project's src/lv_conf.h visible to the LVGL library build too.
    ; Without this the library compiles with LVGL defaults: its internal
    ; 48 KB memory pool and LV_TICK_CUSTOM disabled, which causes an
    ; out-of-memory panic while building the screens at boot.
    -Isrc

; Serial monitor and upload speeds
monitor_speed = 115200
upload_speed = 460800

; Library dependencies with fixed versions
lib_deps = 
    lovyan03/LovyanGFX@^1.1.12
    lvgl/lvgl@^8.3.11
    bblanchon/ArduinoJson@^6.21.5

; Optimization level (override -Os from platform)
build_unflags = -Os

; Serial ports for monitor/upload
monitor_filters = 
    esp32_exception_decoder
    time
    colorize

[env:esp32-cyd-debug]
extends = env:esp32-cyd
build_type = debug
build_flags = 
    ${env:esp32-cyd.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DDEBUG_BUILD

[env:esp32-cyd-release]
extends = env:esp32-cyd
build_type = release
build_flags = 
    ${env:esp32-cyd.build_flags}
    -DCORE_DEBUG_LEVEL=2
    -Os

; Host-side tests for the pure parameter model (no LVGL/Arduino).
; Run: pio test -e native
[env:native]
platform = native
build_flags = -std=gnu++17 -I src -DPIOTEST=1
build_src_filter = -<*> +<ui/params/> +<voxlink/> +<model/> +<session/> +<storage/>
lib_deps = 
    bblanchon/ArduinoJson@^6.21.5
test_framework = unity
test_build_src = yes
