; VoxP4 Control Surface - PlatformIO Configuration
; Hardware: ESP32 Cheap Yellow Display (CYD) 2-USB variant
; Reference: github.com/ovelhaaa/beatCYDa

[platformio]
default_envs = esp32-cyd
src_dir = src
include_dir = src

[env:esp32-cyd]
; Platform and board configuration
platform = espressif32@6.5.0
board = esp32dev
framework = arduino

; CPU configuration
board_build.f_flash = 40000000L
board_build.flash_mode = dio

; Build flags (consolidated)
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -O2

; Serial monitor and upload speeds
monitor_speed = 115200
upload_speed = 460800

; Library dependencies with fixed versions
lib_deps = 
    lovyan03/LovyanGFX@^1.1.12
    lvgl/lvgl@^8.3.11

; Partitions for ESP32
board_build.partitions = default_8MB.csv

; Enable PSRAM
board_has_psram = true

; Optimization level (override -Os from platform)
build_unflags = -Os

; Serial ports for monitor/upload
monitor_filters = 
    esp32_exception_decoder
    time
    colorize

; Extra scripting for custom build steps
extra_scripts = 

[env:esp32-cyd-debug]
extends = env:esp32-cyd
build_type = debug
build_flags = 
    -DCORE_DEBUG_LEVEL=5
    -DDEBUG_BUILD

[env:esp32-cyd-release]
extends = env:esp32-cyd
build_type = release
build_flags = 
    -DCORE_DEBUG_LEVEL=2
    -Os
