<?xml version="1.0" encoding="UTF-8"?>
<svg width="320" height="240" viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg">
  <!-- VoxP4 CYD - Preset Manager Screen Mockup -->
  
  <!-- Background -->
  <rect width="320" height="240" fill="#121212"/>
  
  <!-- Header Bar -->
  <rect width="320" height="32" fill="#2A2A3A"/>
  <text x="160" y="22" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PRESET MANAGER</text>
  
  <!-- Current Preset Display -->
  <rect x="10" y="40" width="300" height="40" fill="#1E1E2E" stroke="#4A90D9" stroke-width="2" rx="6"/>
  <text x="20" y="58" font-family="Arial, sans-serif" font-size="10" fill="#B0B0B0">CURRENT PRESET:</text>
  <text x="20" y="72" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#64B5F6">047: Cathedral Lead</text>
  <circle cx="295" cy="60" r="6" fill="#66BB6A"/>
  
  <!-- Preset List (scrollable area simulation) -->
  <rect x="10" y="88" width="300" height="90" fill="#1E1E2E" stroke="#3A3A4A" stroke-width="1" rx="6"/>
  
  <!-- Preset Item 1 (selected) -->
  <rect x="15" y="93" width="290" height="24" fill="#4A90D9" opacity="0.3" rx="3"/>
  <text x="25" y="109" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF">047: Cathedral Lead</text>
  
  <!-- Preset Item 2 -->
  <rect x="15" y="119" width="290" height="24" fill="none"/>
  <text x="25" y="135" font-family="Arial, sans-serif" font-size="12" fill="#B0B0B0">048: Ambient Pad</text>
  
  <!-- Preset Item 3 -->
  <rect x="15" y="145" width="290" height="24" fill="none"/>
  <text x="25" y="161" font-family="Arial, sans-serif" font-size="12" fill="#B0B0B0">049: Clean Boost</text>
  
  <!-- Preset Item 4 -->
  <rect x="15" y="171" width="290" height="24" fill="none"/>
  <text x="25" y="187" font-family="Arial, sans-serif" font-size="12" fill="#B0B0B0">050: Heavy Rhythm</text>
  
  <!-- Scroll indicator -->
  <rect x="305" y="93" width="5" height="20" fill="#4A90D9" rx="2"/>
  <text x="295" y="175" font-family="Arial, sans-serif" font-size="10" fill="#64B5F6">▼</text>
  
  <!-- Action Buttons Row 1 -->
  <rect x="10" y="185" width="90" height="28" fill="#4A90D9" rx="5"/>
  <text x="55" y="204" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">LOAD</text>
  
  <rect x="108" y="185" width="90" height="28" fill="#4CAF50" rx="5"/>
  <text x="153" y="204" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SAVE</text>
  
  <rect x="206" y="185" width="104" height="28" fill="#FFA726" rx="5"/>
  <text x="258" y="204" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">COPY TO</text>
  
  <!-- Navigation Bar -->
  <rect y="208" width="320" height="32" fill="#2A2A3A"/>
  
  <!-- Nav Buttons -->
  <text x="32" y="230" font-family="Arial, sans-serif" font-size="11" fill="#B0B0B0" text-anchor="middle">⮌ BACK</text>
  <text x="96" y="230" font-family="Arial, sans-serif" font-size="11" fill="#B0B0B0" text-anchor="middle">PERF</text>
  <text x="160" y="230" font-family="Arial, sans-serif" font-size="11" fill="#B0B0B0" text-anchor="middle">CHAIN</text>
  <text x="224" y="230" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">PRESET</text>
  <text x="288" y="230" font-family="Arial, sans-serif" font-size="11" fill="#B0B0B0" text-anchor="middle">SYS</text>
  
  <!-- Quick Select Hint -->
  <text x="160" y="238" font-family="Arial, sans-serif" font-size="9" fill="#707070" text-anchor="middle">Tap preset to load • Long press for options</text>
</svg>
