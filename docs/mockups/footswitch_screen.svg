<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="640" height="480">
  <defs>
    <style>
      .bg { fill: #090B0F; }
      .surface { fill: #121620; }
      .surface-elevated { fill: #191E2A; }
      .header { fill: #121620; }
      .text-primary { fill: #F2F5F7; font-family: Arial, sans-serif; font-size: 14px; }
      .text-secondary { fill: #A5ADBA; font-family: Arial, sans-serif; font-size: 12px; }
      .text-muted { fill: #687181; font-family: Arial, sans-serif; font-size: 11px; }
      .text-accent { fill: #00E5FF; font-family: Arial, sans-serif; font-size: 14px; }
      .effect-card-bg { fill: #191E2A; }
      .effect-card-active { fill: #191E2A; stroke: #00E5FF; stroke-width: 2; }
      .led-on { fill: #00E5FF; }
      .fs-pressed { fill: #FFB300; }
      .nav-tab { fill: #121620; }
      .nav-tab-active { fill: #191E2A; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="320" height="240" class="bg"/>
  
  <!-- HEADER (28px) -->
  <rect width="320" height="28" class="header"/>
  <text x="10" y="19" class="text-primary" font-size="14" font-weight="bold">FOOTSWITCH CONFIG</text>
  
  <!-- FS1 Card (100px) -->
  <rect x="8" y="36" width="304" height="100" rx="6" class="surface"/>
  <rect x="14" y="42" width="292" height="32" rx="4" class="surface-elevated"/>
  <text x="22" y="62" class="text-primary" font-size="14" font-weight="bold">FS1</text>
  <text x="250" y="62" class="fs-pressed" font-size="11" font-weight="bold">● PRESSED</text>
  
  <!-- FS1 Mode -->
  <text x="22" y="85" class="text-secondary" font-size="11">MODE:</text>
  <text x="75" y="85" class="text-accent" font-size="11" font-weight="bold">MOMENTARY</text>
  
  <!-- FS1 Action -->
  <text x="22" y="105" class="text-secondary" font-size="11">ACTION:</text>
  <text x="80" y="105" class="text-primary" font-size="11">HARMONY TOGGLE</text>
  
  <!-- FS1 Hold -->
  <text x="22" y="125" class="text-secondary" font-size="11">HOLD:</text>
  <text x="65" y="125" class="text-primary" font-size="11">GLOBAL BYPASS</text>
  
  <!-- FS2 Card (100px) -->
  <rect x="8" y="142" width="304" height="100" rx="6" class="surface"/>
  <rect x="14" y="148" width="292" height="32" rx="4" class="surface-elevated"/>
  <text x="22" y="168" class="text-primary" font-size="14" font-weight="bold">FS2</text>
  <text x="250" y="168" class="text-muted" font-size="11">RELEASED</text>
  
  <!-- FS2 Mode -->
  <text x="22" y="191" class="text-secondary" font-size="11">MODE:</text>
  <text x="75" y="191" class="text-secondary" font-size="11">LATCH</text>
  
  <!-- FS2 Action -->
  <text x="22" y="211" class="text-secondary" font-size="11">ACTION:</text>
  <text x="80" y="211" class="text-primary" font-size="11">REVERB TOGGLE</text>
  
  <!-- FS2 Hold -->
  <text x="22" y="231" class="text-secondary" font-size="11">HOLD:</text>
  <text x="65" y="231" class="text-primary" font-size="11">PRESET NEXT</text>
  
  <!-- Help text -->
  <text x="160" y="235" class="text-muted" text-anchor="middle" font-size="9">Tap to edit • Press pedal to test</text>
  
  <!-- NAVIGATION BAR (20px) -->
  <rect y="220" width="320" height="20" class="header"/>
  
  <rect x="0" y="220" width="80" height="20" class="nav-tab"/>
  <text x="40" y="234" class="text-secondary" text-anchor="middle" font-size="10">PERF</text>
  
  <rect x="80" y="220" width="80" height="20" class="nav-tab"/>
  <text x="120" y="234" class="text-secondary" text-anchor="middle" font-size="10">FX</text>
  
  <rect x="160" y="220" width="80" height="20" class="nav-tab"/>
  <text x="200" y="234" class="text-secondary" text-anchor="middle" font-size="10">PRESET</text>
  
  <rect x="240" y="220" width="80" height="20" class="nav-tab-active"/>
  <text x="280" y="234" class="text-accent" text-anchor="middle" font-size="10" font-weight="bold">SET</text>
</svg>
