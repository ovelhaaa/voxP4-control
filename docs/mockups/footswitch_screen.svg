<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="640" height="480">
  <defs>
    <!-- VoxP4 Control Surface Design System -->
    <style>
      /* Backgrounds */
      .bg { fill: #090B0F; }
      .surface { fill: #121620; }
      .surface-elevated { fill: #191E2A; }
      .header { fill: #121620; }
      
      /* Text Hierarchy */
      .text-primary { fill: #F2F5F7; font-family: Arial, sans-serif; font-size: 14px; }
      .text-secondary { fill: #A5ADBA; font-family: Arial, sans-serif; font-size: 12px; }
      .text-muted { fill: #687181; font-family: Arial, sans-serif; font-size: 11px; }
      .text-accent { fill: #00E5FF; font-family: Arial, sans-serif; font-size: 13px; }
      
      /* Effect Cards */
      .effect-card-bg { fill: #191E2A; }
      .effect-card-active { fill: #191E2A; stroke: #00E5FF; stroke-width: 2; }
      .led-on { fill: #00E5FF; }
      
      /* Status */
      .fs-pressed { fill: #FFB300; }
      .fs-released { fill: #687181; }
      
      /* Navigation */
      .nav-tab { fill: #121620; }
      .nav-indicator { fill: #00E5FF; }
      
      /* Buttons */
      .btn-segment { fill: #191E2A; stroke: #292F3D; stroke-width: 1; }
      .btn-segment-active { fill: #00E5FF; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="320" height="240" class="bg"/>
  
  <!-- HEADER (28px) -->
  <rect width="320" height="28" class="header"/>
  <text x="12" y="19" class="text-primary" font-size="14" font-weight="700">FOOTSWITCH CONFIG</text>
  
  <!-- FS1 Card (96px) -->
  <rect x="8" y="36" width="304" height="96" rx="6" class="surface"/>
  <rect x="14" y="42" width="292" height="30" rx="4" class="surface-elevated"/>
  <text x="22" y="62" class="text-primary" font-size="14" font-weight="700">FS1</text>
  <circle cx="285" cy="57" r="4" class="fs-pressed"/>
  <text x="268" y="61" class="fs-pressed" font-size="9" font-weight="700">PRESSED</text>
  
  <!-- FS1 Mode -->
  <text x="22" y="84" class="text-secondary" font-size="10" font-weight="600">MODE:</text>
  <text x="70" y="84" class="text-accent" font-size="10" font-weight="700">MOMENTARY</text>
  
  <!-- FS1 Action -->
  <text x="22" y="102" class="text-secondary" font-size="10" font-weight="600">ACTION:</text>
  <text x="75" y="102" class="text-primary" font-size="10">HARMONY TOGGLE</text>
  
  <!-- FS1 Hold -->
  <text x="22" y="120" class="text-secondary" font-size="10" font-weight="600">HOLD:</text>
  <text x="62" y="120" class="text-primary" font-size="10">GLOBAL BYPASS</text>
  
  <!-- FS2 Card (96px) -->
  <rect x="8" y="138" width="304" height="96" rx="6" class="surface"/>
  <rect x="14" y="144" width="292" height="30" rx="4" class="surface-elevated"/>
  <text x="22" y="164" class="text-primary" font-size="14" font-weight="700">FS2</text>
  <circle cx="285" cy="159" r="4" class="fs-released"/>
  <text x="265" y="163" class="text-muted" font-size="9">RELEASED</text>
  
  <!-- FS2 Mode -->
  <text x="22" y="186" class="text-secondary" font-size="10" font-weight="600">MODE:</text>
  <text x="70" y="186" class="text-secondary" font-size="10">LATCH</text>
  
  <!-- FS2 Action -->
  <text x="22" y="204" class="text-secondary" font-size="10" font-weight="600">ACTION:</text>
  <text x="75" y="204" class="text-primary" font-size="10">REVERB TOGGLE</text>
  
  <!-- FS2 Hold -->
  <text x="22" y="222" class="text-secondary" font-size="10" font-weight="600">HOLD:</text>
  <text x="62" y="222" class="text-primary" font-size="10">PRESET NEXT</text>
  
  <!-- Help text -->
  <text x="160" y="236" class="text-muted" text-anchor="middle" font-size="9">Tap to edit • Press pedal to test</text>
  
  <!-- NAVIGATION BAR (20px) -->
  <rect y="220" width="320" height="20" class="header"/>
  
  <!-- Active indicator bar for SET tab -->
  <rect x="240" y="220" width="80" height="3" class="nav-indicator"/>
  
  <!-- Tab labels -->
  <text x="40" y="235" class="text-secondary" text-anchor="middle" font-size="10">PERF</text>
  <text x="120" y="235" class="text-secondary" text-anchor="middle" font-size="10">FX</text>
  <text x="200" y="235" class="text-secondary" text-anchor="middle" font-size="10">PRESET</text>
  <text x="280" y="235" class="text-accent" text-anchor="middle" font-size="10" font-weight="700">SET</text>
</svg>
