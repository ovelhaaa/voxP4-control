<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="640" height="480">
  <defs>
    <!-- VoxP4 Design System Color Palette -->
    <linearGradient id="meterSafe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00E676"/>
      <stop offset="100%" style="stop-color:#00E676"/>
    </linearGradient>
    <linearGradient id="meterWarning" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD740"/>
      <stop offset="100%" style="stop-color:#FFD740"/>
    </linearGradient>
    <linearGradient id="meterClip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF5252"/>
      <stop offset="100%" style="stop-color:#FF5252"/>
    </linearGradient>
    
    <!-- Styles using design tokens -->
    <style>
      .bg { fill: #090B0F; }
      .surface { fill: #121620; }
      .elevated { fill: #191E2A; }
      .header { fill: #1E2330; }
      .text-primary { fill: #F2F5F7; font-family: Arial, sans-serif; }
      .text-secondary { fill: #A5ADBA; font-family: Arial, sans-serif; }
      .text-muted { fill: #687181; font-family: Arial, sans-serif; }
      .text-accent { fill: #06B6D4; font-family: Arial, sans-serif; }
      .text-value { fill: #22D5F0; font-family: Arial, sans-serif; font-weight: bold; }
      .border-subtle { fill: none; stroke: #292F3D; stroke-width: 1; }
      .border-active { fill: none; stroke: #06B6D4; stroke-width: 2; }
      .led-off { fill: #424242; }
      .led-on { fill: #64F0FF; }
      .link-ok { fill: #66BB6A; }
      .link-lost { fill: #EF5350; }
      .fs-pressed { fill: #FFA726; }
      .meter-bg { fill: #1A1F2A; }
      .card { fill: #121620; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="320" height="240" class="bg"/>
  
  <!-- HEADER (28px height) -->
  <rect width="320" height="28" class="header"/>
  <text x="10" y="20" class="text-primary" font-size="16" font-weight="bold">VOXP4</text>
  <text x="75" y="20" class="text-primary" font-size="14">P03 Lead Air</text>
  <text x="235" y="20" class="link-lost" font-family="Arial" font-size="13" font-weight="bold">● LINK LOST</text>
  
  <!-- METERS SECTION (52px height) - horizontal meters with zones -->
  <rect y="28" width="320" height="52" class="bg"/>
  
  <!-- Input Meter Row -->
  <text x="8" y="44" class="text-muted" font-size="11">IN</text>
  <rect x="32" y="34" width="180" height="16" rx="4" class="meter-bg"/>
  <!-- Meter zones background -->
  <rect x="34" y="36" width="135" height="12" rx="2" fill="#00E676" opacity="0.3"/>
  <rect x="169" y="36" width="30" height="12" fill="#FFD740" opacity="0.3"/>
  <rect x="199" y="36" width="13" height="12" fill="#FF5252" opacity="0.3"/>
  <!-- Current level bar -->
  <rect x="34" y="36" width="108" height="12" rx="2" fill="#00E676"/>
  <text x="220" y="45" class="text-value" font-size="11">-8.2</text>
  
  <!-- Output Meter Row -->
  <text x="8" y="68" class="text-muted" font-size="11">OUT</text>
  <rect x="32" y="58" width="180" height="16" rx="4" class="meter-bg"/>
  <rect x="34" y="60" width="135" height="12" rx="2" fill="#00E676" opacity="0.3"/>
  <rect x="169" y="60" width="30" height="12" fill="#FFD740" opacity="0.3"/>
  <rect x="199" y="60" width="13" height="12" fill="#FF5252" opacity="0.3"/>
  <rect x="34" y="60" width="130" height="12" rx="2" fill="#00E676"/>
  <text x="220" y="69" class="text-value" font-size="11">-4.1</text>
  
  <!-- PITCH SECTION (40px height) - musical hierarchy -->
  <rect y="80" width="320" height="40" class="elevated" stroke="#292F3D" stroke-width="1"/>
  <!-- Large note name on left -->
  <text x="20" y="108" class="text-value" font-size="28" font-weight="bold">A3</text>
  <!-- Frequency and status on right -->
  <text x="280" y="100" class="text-secondary" font-size="12" text-anchor="end">220.1 Hz</text>
  <text x="280" y="115" class="text-muted" font-size="10" text-anchor="end">UNVOICED</text>
  
  <!-- EFFECT CARDS (56px height) - subtle design, NOT full green cards -->
  <rect y="120" width="320" height="56" class="bg"/>
  
  <!-- HARMONY Card (ON) - border accent cyan + LED bright -->
  <rect x="6" y="126" width="74" height="46" rx="6" class="card" stroke="#06B6D4" stroke-width="2"/>
  <text x="12" y="138" class="text-primary" font-size="9" font-weight="bold">HARMONY</text>
  <circle cx="72" cy="134" r="4" class="led-on"/>
  <text x="12" y="162" class="text-value" font-size="10">+3rd</text>
  
  <!-- REVERB Card (ON) -->
  <rect x="86" y="126" width="74" height="46" rx="6" class="card" stroke="#06B6D4" stroke-width="2"/>
  <text x="92" y="138" class="text-primary" font-size="9" font-weight="bold">REVERB</text>
  <circle cx="152" cy="134" r="4" class="led-on"/>
  <text x="92" y="162" class="text-value" font-size="10">18%</text>
  
  <!-- DELAY Card (OFF) - subtle border, dimmed LED -->
  <rect x="166" y="126" width="74" height="46" rx="6" class="card" stroke="#292F3D" stroke-width="1"/>
  <text x="172" y="138" class="text-secondary" font-size="9" font-weight="bold">DELAY</text>
  <circle cx="232" cy="134" r="4" class="led-off"/>
  <text x="172" y="162" class="text-muted" font-size="10">--</text>
  
  <!-- LIMIT Card (ON) -->
  <rect x="246" y="126" width="74" height="46" rx="6" class="card" stroke="#06B6D4" stroke-width="2"/>
  <text x="252" y="138" class="text-primary" font-size="9" font-weight="bold">LIMIT</text>
  <circle cx="312" cy="134" r="4" class="led-on"/>
  <text x="252" y="162" class="text-value" font-size="10">-3dB</text>
  
  <!-- FOOTSWITCH BAR (36px height) -->
  <rect y="176" width="320" height="36" class="header"/>
  
  <!-- FS1 Card -->
  <rect x="6" y="182" width="152" height="26" rx="4" class="surface" stroke="#292F3D" stroke-width="1"/>
  <text x="14" y="199" class="text-muted" font-size="9">FS1</text>
  <text x="48" y="199" class="text-accent" font-size="11" font-weight="bold">HARMONY</text>
  
  <!-- FS2 Card -->
  <rect x="162" y="182" width="152" height="26" rx="4" class="surface" stroke="#292F3D" stroke-width="1"/>
  <text x="170" y="199" class="text-muted" font-size="9">FS2</text>
  <text x="204" y="199" class="text-accent" font-size="11" font-weight="bold">REVERB</text>
  
  <!-- NAVIGATION BAR (24px height) - tabs at bottom -->
  <rect y="216" width="320" height="24" class="header"/>
  
  <!-- PERF tab (active) - cyan bar indicator -->
  <rect x="0" y="216" width="80" height="24" class="surface"/>
  <rect x="0" y="216" width="80" height="3" fill="#06B6D4"/>
  <text x="40" y="232" class="text-primary" font-size="11" font-weight="bold" text-anchor="middle">PERF</text>
  
  <!-- FX tab -->
  <rect x="80" y="216" width="80" height="24" class="header"/>
  <text x="120" y="232" class="text-secondary" font-size="11" text-anchor="middle">FX</text>
  
  <!-- PRESET tab -->
  <rect x="160" y="216" width="80" height="24" class="header"/>
  <text x="200" y="232" class="text-secondary" font-size="11" text-anchor="middle">PRESET</text>
  
  <!-- SET tab -->
  <rect x="240" y="216" width="80" height="24" class="header"/>
  <text x="280" y="232" class="text-secondary" font-size="11" text-anchor="middle">SET</text>
</svg>
