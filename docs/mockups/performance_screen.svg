<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="640" height="480">
  <defs>
    <!-- VoxP4 Control Surface Design System -->
    <style>
      /* Backgrounds */
      .bg { fill: #090B0F; }
      .surface { fill: #121620; }
      .surface-elevated { fill: #191E2A; }
      .header { fill: #121620; }
      
      /* Borders */
      .border-subtle { stroke: #292F3D; stroke-width: 1; fill: none; }
      .border-active { stroke: #00E5FF; stroke-width: 2; fill: none; }
      
      /* Text Hierarchy */
      .text-primary { fill: #F2F5F7; font-family: Arial, sans-serif; font-size: 14px; }
      .text-secondary { fill: #A5ADBA; font-family: Arial, sans-serif; font-size: 12px; }
      .text-muted { fill: #687181; font-family: Arial, sans-serif; font-size: 11px; }
      .text-hero { fill: #F2F5F7; font-family: Arial, sans-serif; font-size: 32px; font-weight: bold; }
      .text-value { fill: #F2F5F7; font-family: Arial, sans-serif; font-size: 16px; font-weight: 600; }
      .text-accent { fill: #00E5FF; font-family: Arial, sans-serif; font-size: 13px; }
      .text-link-ok { fill: #4CAF50; font-family: Arial, sans-serif; font-size: 10px; font-weight: bold; }
      .text-link-lost { fill: #F44336; font-family: Arial, sans-serif; font-size: 10px; font-weight: bold; }
      
      /* Effect Cards */
      .effect-card-bg { fill: #191E2A; }
      .effect-card-active { fill: #191E2A; stroke: #00E5FF; stroke-width: 2; }
      .led-on { fill: #00E5FF; }
      .led-off { fill: #292F3D; }
      
      /* Meters - Horizontal with zones */
      .meter-bg { fill: #191E2A; }
      .meter-safe { fill: #00E5FF; }
      .meter-warning { fill: #FFB300; }
      .meter-clip { fill: #F44336; }
      .meter-peak { stroke: #F2F5F7; stroke-width: 2; }
      
      /* Status Indicators */
      .link-ok { fill: #4CAF50; }
      .link-lost { fill: #F44336; }
      .fs-pressed { fill: #FFB300; }
      
      /* Navigation */
      .nav-tab { fill: #121620; }
      .nav-tab-active { fill: #191E2A; }
      .nav-indicator { fill: #00E5FF; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="320" height="240" class="bg"/>
  
  <!-- HEADER (28px) - Preset name + Link status -->
  <rect width="320" height="28" class="header"/>
  <text x="12" y="19" class="text-primary" font-size="13" font-weight="600">P03 Lead Air</text>
  
  <!-- Link Status Indicator (right side) -->
  <circle cx="288" cy="14" r="4" class="link-lost"/>
  <text x="308" y="17" class="text-link-lost">LINK LOST</text>
  
  <!-- METERS SECTION (56px) - Horizontal VU meters -->
  <rect y="28" width="320" height="56" class="surface"/>
  
  <!-- Input Meter Row -->
  <text x="8" y="48" class="text-secondary" font-size="10" font-weight="600">IN</text>
  <rect x="32" y="38" width="210" height="14" rx="3" class="meter-bg"/>
  <!-- Safe zone (up to -6dB) -->
  <rect x="32" y="38" width="140" height="14" rx="3" class="meter-safe"/>
  <!-- Warning zone (-6 to -3dB) -->
  <rect x="172" y="38" width="35" height="14" rx="3" class="meter-warning"/>
  <!-- Clip zone (-3 to 0dB) -->
  <rect x="207" y="38" width="35" height="14" rx="3" class="meter-clip"/>
  <!-- Peak hold marker -->
  <line x1="178" y1="36" x2="178" y2="54" class="meter-peak"/>
  <text x="252" y="49" class="text-value" font-size="13">-8.2</text>
  
  <!-- Output Meter Row -->
  <text x="8" y="72" class="text-secondary" font-size="10" font-weight="600">OUT</text>
  <rect x="32" y="62" width="210" height="14" rx="3" class="meter-bg"/>
  <rect x="32" y="62" width="155" height="14" rx="3" class="meter-safe"/>
  <rect x="187" y="62" width="35" height="14" rx="3" class="meter-warning"/>
  <rect x="207" y="62" width="35" height="14" rx="3" class="meter-clip"/>
  <!-- Peak hold marker -->
  <line x1="193" y1="60" x2="193" y2="78" class="meter-peak"/>
  <text x="252" y="73" class="text-value" font-size="13">-5.1</text>
  
  <!-- PITCH SECTION (52px) - Musical hierarchy -->
  <rect y="84" width="320" height="52" class="surface-elevated"/>
  
  <!-- Note name (hero) -->
  <text x="160" y="112" class="text-hero" text-anchor="middle">A3</text>
  
  <!-- Frequency and state -->
  <text x="160" y="128" class="text-accent" text-anchor="middle">220.1 Hz</text>
  <text x="160" y="142" class="text-primary" text-anchor="middle" font-size="11" font-weight="700">VOICED</text>
  
  <!-- EFFECT CARDS ROW (56px) - 4 effects -->
  <rect y="136" width="320" height="56" class="surface"/>
  
  <!-- HARMONY Card (ON) -->
  <rect x="6" y="140" width="74" height="48" rx="6" class="effect-card-active"/>
  <circle cx="15" cy="150" r="3" class="led-on"/>
  <text x="43" y="158" class="text-primary" text-anchor="middle" font-size="10" font-weight="700">HARMONY</text>
  <text x="43" y="176" class="text-accent" text-anchor="middle" font-size="11">+3rd</text>
  
  <!-- REVERB Card (ON) -->
  <rect x="86" y="140" width="74" height="48" rx="6" class="effect-card-active"/>
  <circle cx="95" cy="150" r="3" class="led-on"/>
  <text x="123" y="158" class="text-primary" text-anchor="middle" font-size="10" font-weight="700">REVERB</text>
  <text x="123" y="176" class="text-accent" text-anchor="middle" font-size="11">18%</text>
  
  <!-- LIMIT Card (ON) -->
  <rect x="166" y="140" width="74" height="48" rx="6" class="effect-card-active"/>
  <circle cx="175" cy="150" r="3" class="led-on"/>
  <text x="203" y="158" class="text-primary" text-anchor="middle" font-size="10" font-weight="700">LIMIT</text>
  <text x="203" y="176" class="text-accent" text-anchor="middle" font-size="11">-3dB</text>
  
  <!-- DELAY Card (OFF) -->
  <rect x="246" y="140" width="68" height="48" rx="6" class="effect-card-bg" stroke="#292F3D" stroke-width="1"/>
  <circle cx="255" cy="150" r="3" class="led-off"/>
  <text x="280" y="158" class="text-secondary" text-anchor="middle" font-size="10" font-weight="700">DELAY</text>
  <text x="280" y="176" class="text-muted" text-anchor="middle" font-size="11">OFF</text>
  
  <!-- FOOTSWITCH BAR (36px) -->
  <rect y="192" width="320" height="36" class="surface-elevated"/>
  
  <!-- FS1 Card -->
  <rect x="8" y="196" width="148" height="28" rx="4" class="nav-tab"/>
  <text x="18" y="214" class="text-muted" font-size="9" font-weight="600">FS1</text>
  <text x="78" y="214" class="text-primary" font-size="11" font-weight="700">HARMONY</text>
  
  <!-- FS2 Card -->
  <rect x="164" y="196" width="148" height="28" rx="4" class="nav-tab"/>
  <text x="174" y="214" class="text-muted" font-size="9" font-weight="600">FS2</text>
  <text x="234" y="214" class="text-primary" font-size="11" font-weight="700">REVERB</text>
  
  <!-- NAVIGATION BAR (20px) - 4 tabs -->
  <rect y="220" width="320" height="20" class="header"/>
  
  <!-- Active indicator bar for PERF tab -->
  <rect x="0" y="220" width="80" height="3" class="nav-indicator"/>
  
  <!-- Tab labels -->
  <text x="40" y="235" class="text-accent" text-anchor="middle" font-size="10" font-weight="700">PERF</text>
  <text x="120" y="235" class="text-secondary" text-anchor="middle" font-size="10">FX</text>
  <text x="200" y="235" class="text-secondary" text-anchor="middle" font-size="10">PRESET</text>
  <text x="280" y="235" class="text-secondary" text-anchor="middle" font-size="10">SET</text>
</svg>
