<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="640" height="480">
  <defs>
    <!-- VoxP4 Design System Color Palette -->
    <linearGradient id="meterSafe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00E676"/>
      <stop offset="100%" style="stop-color:#00E676"/>
    </linearGradient>
    <linearGradient id="meterWarning" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD740"/>
      <stop offset="100%" style="stop-color:#FFD740"/>
    </linearGradient>
    <linearGradient id="meterClip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF5252"/>
      <stop offset="100%" style="stop-color:#FF5252"/>
    </linearGradient>
    
    <!-- Styles using design tokens -->
    <style>
      .bg { fill: #090B0F; }
      .surface { fill: #121620; }
      .elevated { fill: #191E2A; }
      .header { fill: #1E2330; }
      .text-primary { fill: #F2F5F7; font-family: Arial, sans-serif; }
      .text-secondary { fill: #A5ADBA; font-family: Arial, sans-serif; }
      .text-muted { fill: #687181; font-family: Arial, sans-serif; }
      .text-accent { fill: #06B6D4; font-family: Arial, sans-serif; }
      .text-value { fill: #22D5F0; font-family: Arial, sans-serif; font-weight: bold; }
      .border-subtle { fill: none; stroke: #292F3D; stroke-width: 1; }
      .border-active { fill: none; stroke: #06B6D4; stroke-width: 2; }
      .led-off { fill: #424242; }
      .led-on { fill: #64F0FF; }
      .link-ok { fill: #66BB6A; }
      .link-lost { fill: #EF5350; }
      .fs-pressed { fill: #FFA726; }
      .meter-bg { fill: #1A1F2A; }
      .card { fill: #121620; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="320" height="240" class="bg"/>
  
  <!-- HEADER (28px height) -->
  <rect width="320" height="28" class="header"/>
  <text x="10" y="20" class="text-primary" font-size="16" font-weight="bold">VOXP4</text>
  <text x="75" y="20" class="text-primary" font-size="14">P03 Lead Air</text>
  <text x="235" y="20" class="link-lost" font-family="Arial" font-size="13" font-weight="bold">● LINK LOST</text>
  
  <!-- METERS SECTION (horizontal layout, 56px height) -->
  <rect y="28" width="320" height="56" class="surface"/>
  
  <!-- Input Meter Row -->
  <text x="8" y="46" class="text-muted" font-size="11">IN</text>
  <rect x="30" y="38" width="200" height="14" rx="3" class="meter-bg"/>
  <!-- Safe zone: -60 to -12dB (75% of bar) -->
  <rect x="30" y="38" width="150" height="14" rx="3" fill="url(#meterSafe)"/>
  <!-- Warning zone: -12 to -3dB -->
  <rect x="180" y="38" width="35" height="14" fill="url(#meterWarning)"/>
  <!-- Clip zone: -3 to 0dB -->
  <rect x="215" y="38" width="15" height="14" fill="url(#meterClip)"/>
  <!-- Current level indicator -->
  <rect x="30" y="38" width="120" height="14" rx="3" fill="#00E676" opacity="0.9"/>
  <text x="240" y="48" class="text-value" font-size="12">-8.2</text>
  
  <!-- Output Meter Row -->
  <text x="8" y="70" class="text-muted" font-size="11">OUT</text>
  <rect x="30" y="62" width="200" height="14" rx="3" class="meter-bg"/>
  <rect x="30" y="62" width="150" height="14" rx="3" fill="url(#meterSafe)"/>
  <rect x="180" y="62" width="35" height="14" fill="url(#meterWarning)"/>
  <rect x="215" y="62" width="15" height="14" fill="url(#meterClip)"/>
  <rect x="30" y="62" width="145" height="14" rx="3" fill="#00E676" opacity="0.9"/>
  <text x="240" y="72" class="text-value" font-size="12">-4.1</text>
  
  <!-- PITCH SECTION (40px height) -->
  <rect y="84" width="320" height="40" class="bg"/>
  <!-- Note display - large, musical hierarchy -->
  <text x="160" y="108" class="text-primary" font-size="28" font-weight="bold" text-anchor="middle">A3</text>
  <text x="160" y="122" class="text-secondary" font-size="12" text-anchor="middle">220.1 Hz</text>
  <text x="280" y="108" class="text-muted" font-size="11" text-anchor="middle">UNVOICED</text>
  
  <!-- EFFECT CARDS (56px height) - subtle design, NOT full green cards -->
  <rect y="124" width="320" height="56" class="surface"/>
  
  <!-- HARMONY Card (ON) - border accent + LED -->
  <rect x="8" y="130" width="74" height="46" rx="6" class="card" stroke="#06B6D4" stroke-width="2"/>
  <text x="14" y="144" class="text-primary" font-size="10" font-weight="bold">HARMONY</text>
  <circle cx="70" cy="138" r="4" class="led-on"/>
  <text x="14" y="168" class="text-value" font-size="11">+3rd</text>
  
  <!-- REVERB Card (ON) -->
  <rect x="88" y="130" width="74" height="46" rx="6" class="card" stroke="#06B6D4" stroke-width="2"/>
  <text x="94" y="144" class="text-primary" font-size="10" font-weight="bold">REVERB</text>
  <circle cx="150" cy="138" r="4" class="led-on"/>
  <text x="94" y="168" class="text-value" font-size="11">18%</text>
  
  <!-- LIMIT Card (ON) -->
  <rect x="168" y="130" width="74" height="46" rx="6" class="card" stroke="#06B6D4" stroke-width="2"/>
  <text x="174" y="144" class="text-primary" font-size="10" font-weight="bold">LIMIT</text>
  <circle cx="230" cy="138" r="4" class="led-on"/>
  <text x="174" y="168" class="text-value" font-size="11">-3dB</text>
  
  <!-- DELAY Card (OFF) - no border, dimmed LED -->
  <rect x="248" y="130" width="74" height="46" rx="6" class="card" stroke="#292F3D" stroke-width="1"/>
  <text x="254" y="144" class="text-secondary" font-size="10" font-weight="bold">DELAY</text>
  <circle cx="310" cy="138" r="4" class="led-off"/>
  <text x="254" y="168" class="text-muted" font-size="11">--</text>
  
  <!-- FOOTSWITCH BAR (36px height) -->
  <rect y="180" width="320" height="36" class="elevated"/>
  
  <!-- FS1 -->
  <rect x="10" y="186" width="140" height="24" rx="4" class="surface" stroke="#292F3D" stroke-width="1"/>
  <text x="18" y="203" class="text-muted" font-size="10">FS1</text>
  <text x="55" y="203" class="text-accent" font-size="11" font-weight="bold">HARMONY</text>
  
  <!-- FS2 -->
  <rect x="170" y="186" width="140" height="24" rx="4" class="surface" stroke="#292F3D" stroke-width="1"/>
  <text x="178" y="203" class="text-muted" font-size="10">FS2</text>
  <text x="215" y="203" class="text-accent" font-size="11" font-weight="bold">REVERB</text>
  
  <!-- NAVIGATION BAR (24px height) - tabs at bottom -->
  <rect y="216" width="320" height="24" class="header"/>
  
  <!-- PERF tab (active) -->
  <rect x="0" y="216" width="80" height="24" class="surface"/>
  <rect x="0" y="216" width="80" height="3" fill="#06B6D4"/>
  <text x="40" y="233" class="text-primary" font-size="11" font-weight="bold" text-anchor="middle">PERF</text>
  
  <!-- FX tab -->
  <rect x="80" y="216" width="80" height="24" class="header"/>
  <text x="120" y="233" class="text-secondary" font-size="11" text-anchor="middle">FX</text>
  
  <!-- PRESET tab -->
  <rect x="160" y="216" width="80" height="24" class="header"/>
  <text x="200" y="233" class="text-secondary" font-size="11" text-anchor="middle">PRESET</text>
  
  <!-- SET tab -->
  <rect x="240" y="216" width="80" height="24" class="header"/>
  <text x="280" y="233" class="text-secondary" font-size="11" text-anchor="middle">SET</text>
</svg>
