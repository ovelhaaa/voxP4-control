<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="640" height="480">
  <defs>
    <!-- Gradients -->
    <linearGradient id="meterGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50"/>
      <stop offset="70%" style="stop-color:#4CAF50"/>
      <stop offset="100%" style="stop-color:#8BC34A"/>
    </linearGradient>
    <linearGradient id="meterYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFEB3B"/>
      <stop offset="100%" style="stop-color:#FFC107"/>
    </linearGradient>
    <linearGradient id="meterRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F44336"/>
      <stop offset="100%" style="stop-color:#D32F2F"/>
    </linearGradient>
    
    <!-- Styles -->
    <style>
      .bg { fill: #121212; }
      .card { fill: #1E1E2E; }
      .header { fill: #2A2A3A; }
      .text-primary { fill: #FFFFFF; font-family: Arial, sans-serif; font-size: 14px; }
      .text-secondary { fill: #B0B0B0; font-family: Arial, sans-serif; font-size: 12px; }
      .text-muted { fill: #707070; font-family: Arial, sans-serif; font-size: 14px; }
      .effect-off { fill: #424242; }
      .effect-on { fill: #4CAF50; }
      .link-ok { fill: #66BB6A; }
      .link-lost { fill: #EF5350; }
      .fs-pressed { fill: #FFA726; }
      .meter-bg { fill: #303030; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="320" height="240" class="bg"/>
  
  <!-- HEADER -->
  <rect width="320" height="32" class="header"/>
  <text x="8" y="22" class="text-primary" font-size="16" font-weight="bold">VOXP4</text>
  <text x="70" y="22" class="text-primary">P03 Lead Air</text>
  <text x="260" y="22" class="link-lost" font-family="Arial" font-size="14">○ LINK</text>
  
  <!-- METERS SECTION -->
  <rect y="32" width="320" height="60" class="bg"/>
  
  <!-- Input Meter Row -->
  <text x="8" y="52" class="text-secondary">IN</text>
  <rect x="32" y="40" width="180" height="16" rx="4" class="meter-bg"/>
  <rect x="32" y="40" width="135" height="16" rx="4" fill="url(#meterGreen)"/>
  <text x="220" y="52" class="text-secondary">-8.2 dB</text>
  
  <!-- Output Meter Row -->
  <text x="8" y="76" class="text-secondary">OUT</text>
  <rect x="32" y="64" width="180" height="16" rx="4" class="meter-bg"/>
  <rect x="32" y="64" width="155" height="16" rx="4" fill="url(#meterGreen)"/>
  <text x="220" y="76" class="text-secondary">-5.1 dB</text>
  
  <!-- PITCH SECTION -->
  <rect y="92" width="320" height="32" class="card" rx="8"/>
  <text x="12" y="114" class="text-primary">Pitch: A3  220.1Hz</text>
  <text x="250" y="114" class="text-muted">UNVOICED</text>
  
  <!-- EFFECT BUTTONS -->
  <rect y="124" width="320" height="56" class="bg"/>
  
  <!-- HARMONY Button (ON) -->
  <rect x="10" y="130" width="70" height="44" rx="8" class="effect-on"/>
  <text x="45" y="156" class="text-primary" text-anchor="middle" font-size="11">HARMONY</text>
  
  <!-- REVERB Button (ON) -->
  <rect x="90" y="130" width="70" height="44" rx="8" class="effect-on"/>
  <text x="125" y="156" class="text-primary" text-anchor="middle" font-size="11">REVERB</text>
  
  <!-- LIMIT Button (ON) -->
  <rect x="170" y="130" width="70" height="44" rx="8" class="effect-on"/>
  <text x="205" y="156" class="text-primary" text-anchor="middle" font-size="11">LIMIT</text>
  
  <!-- DELAY Button (OFF) -->
  <rect x="250" y="130" width="70" height="44" rx="8" class="effect-off"/>
  <text x="285" y="156" class="text-primary" text-anchor="middle" font-size="11">DELAY</text>
  
  <!-- FOOTSWITCH LABELS -->
  <rect y="180" width="320" height="32" class="header"/>
  <text x="160" y="202" class="text-secondary" text-anchor="middle">FS1 HARMONY     FS2 REVERB</text>
  
  <!-- Navigation hint at bottom -->
  <rect y="212" width="320" height="28" class="bg"/>
  <text x="160" y="232" class="text-muted" text-anchor="middle" font-size="11">[PERF] [FX] [PRESET] [SET]</text>
</svg>
