<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="640" height="480">
  <defs>
    <!-- New Design System Colors -->
    <style>
      .bg { fill: #090B0F; }
      .surface { fill: #121620; }
      .surface-elevated { fill: #191E2A; }
      .header { fill: #121620; }
      .border-subtle { stroke: #292F3D; stroke-width: 1; fill: none; }
      .text-primary { fill: #F2F5F7; font-family: Arial, sans-serif; font-size: 14px; }
      .text-secondary { fill: #A5ADBA; font-family: Arial, sans-serif; font-size: 12px; }
      .text-muted { fill: #687181; font-family: Arial, sans-serif; font-size: 11px; }
      .text-hero { fill: #F2F5F7; font-family: Arial, sans-serif; font-size: 28px; font-weight: bold; }
      .text-accent { fill: #00E5FF; font-family: Arial, sans-serif; font-size: 14px; }
      .accent-border { stroke: #00E5FF; stroke-width: 2; fill: none; }
      .effect-card-bg { fill: #191E2A; }
      .effect-card-active { fill: #191E2A; stroke: #00E5FF; stroke-width: 2; }
      .led-on { fill: #00E5FF; }
      .led-off { fill: #292F3D; }
      .meter-bg { fill: #191E2A; }
      .meter-safe { fill: #00E5FF; }
      .meter-warning { fill: #FFB300; }
      .meter-clip { fill: #F44336; }
      .link-ok { fill: #4CAF50; }
      .link-lost { fill: #F44336; }
      .fs-pressed { fill: #FFB300; }
      .nav-tab { fill: #121620; }
      .nav-tab-active { fill: #191E2A; border-top: 2px solid #00E5FF; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="320" height="240" class="bg"/>
  
  <!-- HEADER (28px) -->
  <rect width="320" height="28" class="header"/>
  <text x="10" y="19" class="text-secondary" font-size="11">P03 Lead Air</text>
  <circle cx="295" cy="14" r="5" class="link-lost" stroke="#F44336" stroke-width="1.5" fill="none"/>
  <text x="308" y="18" class="link-lost" font-family="Arial" font-size="10" font-weight="bold">LINK</text>
  
  <!-- METERS SECTION (52px) -->
  <rect y="28" width="320" height="52" class="surface"/>
  
  <!-- Input Meter Row -->
  <text x="6" y="46" class="text-secondary" font-size="10">IN</text>
  <rect x="24" y="36" width="220" height="12" rx="2" class="meter-bg"/>
  <rect x="24" y="36" width="165" height="12" rx="2" class="meter-safe"/>
  <rect x="170" y="36" width="20" height="12" rx="2" class="meter-warning"/>
  <rect x="224" y="36" width="20" height="12" rx="2" class="meter-clip"/>
  <!-- Peak hold marker -->
  <line x1="189" y1="34" x2="189" y2="50" stroke="#F2F5F7" stroke-width="1.5"/>
  <text x="252" y="46" class="text-secondary" font-size="11">-8.2</text>
  
  <!-- Output Meter Row -->
  <text x="6" y="70" class="text-secondary" font-size="10">OUT</text>
  <rect x="24" y="60" width="220" height="12" rx="2" class="meter-bg"/>
  <rect x="24" y="60" width="185" height="12" rx="2" class="meter-safe"/>
  <rect x="190" y="60" width="20" height="12" rx="2" class="meter-warning"/>
  <rect x="224" y="60" width="20" height="12" rx="2" class="meter-clip"/>
  <!-- Peak hold marker -->
  <line x1="209" y1="58" x2="209" y2="74" stroke="#F2F5F7" stroke-width="1.5"/>
  <text x="252" y="70" class="text-secondary" font-size="11">-5.1</text>
  
  <!-- PITCH SECTION (48px) -->
  <rect y="80" width="320" height="48" class="surface-elevated"/>
  <text x="160" y="110" class="text-hero" text-anchor="middle" font-size="32">A3</text>
  <text x="160" y="126" class="text-accent" text-anchor="middle" font-size="13">220.1 Hz</text>
  <text x="160" y="140" class="text-primary" text-anchor="middle" font-size="11" font-weight="bold">VOICED</text>
  
  <!-- EFFECT CARDS (56px) -->
  <rect y="128" width="320" height="56" class="surface"/>
  
  <!-- HARMONY Card (ON) -->
  <rect x="6" y="132" width="74" height="48" rx="6" class="effect-card-active"/>
  <circle cx="14" cy="140" r="3" class="led-on"/>
  <text x="43" y="150" class="text-primary" text-anchor="middle" font-size="10" font-weight="bold">HARMONY</text>
  <text x="43" y="168" class="text-accent" text-anchor="middle" font-size="11">+3rd</text>
  
  <!-- REVERB Card (ON) -->
  <rect x="86" y="132" width="74" height="48" rx="6" class="effect-card-active"/>
  <circle cx="94" cy="140" r="3" class="led-on"/>
  <text x="123" y="150" class="text-primary" text-anchor="middle" font-size="10" font-weight="bold">REVERB</text>
  <text x="123" y="168" class="text-accent" text-anchor="middle" font-size="11">18%</text>
  
  <!-- LIMIT Card (ON) -->
  <rect x="166" y="132" width="74" height="48" rx="6" class="effect-card-active"/>
  <circle cx="174" cy="140" r="3" class="led-on"/>
  <text x="203" y="150" class="text-primary" text-anchor="middle" font-size="10" font-weight="bold">LIMIT</text>
  <text x="203" y="168" class="text-accent" text-anchor="middle" font-size="11">-3dB</text>
  
  <!-- DELAY Card (OFF) -->
  <rect x="246" y="132" width="68" height="48" rx="6" class="effect-card-bg" stroke="#292F3D" stroke-width="1"/>
  <circle cx="254" cy="140" r="3" class="led-off"/>
  <text x="280" y="150" class="text-secondary" text-anchor="middle" font-size="10" font-weight="bold">DELAY</text>
  <text x="280" y="168" class="text-muted" text-anchor="middle" font-size="11">OFF</text>
  
  <!-- FOOTSWITCH BAR (36px) -->
  <rect y="184" width="320" height="36" class="surface-elevated"/>
  
  <!-- FS1 -->
  <rect x="8" y="188" width="148" height="28" rx="4" class="nav-tab"/>
  <text x="20" y="207" class="text-muted" font-size="9">FS1</text>
  <text x="80" y="207" class="text-primary" font-size="11" font-weight="bold">HARMONY</text>
  
  <!-- FS2 -->
  <rect x="164" y="188" width="148" height="28" rx="4" class="nav-tab"/>
  <text x="176" y="207" class="text-muted" font-size="9">FS2</text>
  <text x="236" y="207" class="text-primary" font-size="11" font-weight="bold">REVERB</text>
  
  <!-- NAVIGATION BAR (20px) -->
  <rect y="220" width="320" height="20" class="header"/>
  
  <!-- Tabs -->
  <rect x="0" y="220" width="80" height="20" class="nav-tab-active"/>
  <text x="40" y="234" class="text-accent" text-anchor="middle" font-size="10" font-weight="bold">PERF</text>
  
  <rect x="80" y="220" width="80" height="20" class="nav-tab"/>
  <text x="120" y="234" class="text-secondary" text-anchor="middle" font-size="10">FX</text>
  
  <rect x="160" y="220" width="80" height="20" class="nav-tab"/>
  <text x="200" y="234" class="text-secondary" text-anchor="middle" font-size="10">PRESET</text>
  
  <rect x="240" y="220" width="80" height="20" class="nav-tab"/>
  <text x="280" y="234" class="text-secondary" text-anchor="middle" font-size="10">SET</text>
</svg>
