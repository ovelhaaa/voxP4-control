<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <style>
    .bg{fill:#090A0E}.surface{fill:#14151B}.elev{fill:#1C1D24}.header{fill:#101116}.nav{fill:#101116}.panel{fill:#202128}
    .t1{fill:#F0EDE5}.t2{fill:#B1ACA3}.tm{fill:#716E69}
    .acc{fill:#F45126}.accb{fill:#FF6030}.accd{fill:#B83A1C}
    .aud{fill:#20D6C7}.audb{fill:#55EFE2}.audd{fill:#148E87}
    .dis{fill:#414147}
    text{font-family:Arial,Helvetica,sans-serif}
  </style>

  <rect width="320" height="240" class="bg"/>

  <!-- HEADER: preset has visual priority -->
  <rect x="4" y="4" width="312" height="24" rx="3" class="header"/>
  <text x="12" y="20.5" class="t1" font-size="13" font-weight="bold">P03  LEAD AIR</text>
  <circle cx="272" cy="16" r="4" class="aud"/>
  <text x="282" y="20" class="aud" font-size="11">LINK</text>

  <!-- PITCH -->
  <rect x="4" y="32" width="312" height="40" rx="5" class="elev" stroke="#292A30" stroke-width="1"/>
  <text x="18" y="59" class="audb" font-size="18" font-weight="bold">A3</text>
  <text x="306" y="50" class="t2" font-size="11" text-anchor="end">220.1 Hz</text>
  <text x="306" y="63" class="aud" font-size="9" text-anchor="end">VOICED</text>

  <!-- METERS -->
  <text x="6" y="88" class="tm" font-size="9">IN</text>
  <rect x="30" y="76" width="286" height="16" rx="3" class="panel"/>
  <rect x="34" y="80" width="10" height="8" rx="2" class="aud"/>
  <rect x="46" y="80" width="196" height="8" rx="2" class="aud"/>
  <text x="312" y="88" class="t2" font-size="9" text-anchor="end">-12</text>

  <text x="6" y="106" class="tm" font-size="9">OUT</text>
  <rect x="30" y="94" width="286" height="16" rx="3" class="panel"/>
  <rect x="34" y="98" width="10" height="8" rx="2" class="aud"/>
  <rect x="46" y="98" width="210" height="8" rx="2" class="aud"/>
  <text x="312" y="106" class="t2" font-size="9" text-anchor="end">-6</text>

  <!-- EFFECT CARDS -->
  <!-- HARMONY ON: neutral outline + top accent rail + LED -->
  <rect x="4" y="114" width="72" height="46" rx="5" class="surface" stroke="#292A30" stroke-width="1"/>
  <rect x="4.5" y="114.5" width="71" height="2.5" class="acc"/>
  <text x="11" y="127" class="t1" font-size="8" font-weight="bold">HARMONY</text>
  <circle cx="68" cy="124" r="3.5" class="acc"/>
  <text x="11" y="152" class="t1" font-size="11">+3rd</text>

  <!-- REVERB ON -->
  <rect x="80" y="114" width="72" height="46" rx="5" class="surface" stroke="#292A30" stroke-width="1"/>
  <rect x="80.5" y="114.5" width="71" height="2.5" class="acc"/>
  <text x="87" y="127" class="t1" font-size="8" font-weight="bold">REVERB</text>
  <circle cx="144" cy="124" r="3.5" class="acc"/>
  <text x="87" y="152" class="t1" font-size="11">18%</text>

  <!-- DELAY OFF -->
  <rect x="156" y="114" width="72" height="46" rx="5" class="surface" stroke="#292A30" stroke-width="1"/>
  <text x="163" y="127" class="t2" font-size="8" font-weight="bold">DELAY</text>
  <circle cx="220" cy="124" r="3.5" class="dis"/>
  <text x="163" y="152" class="tm" font-size="11">--</text>

  <!-- LIMITER ON -->
  <rect x="232" y="114" width="72" height="46" rx="5" class="surface" stroke="#292A30" stroke-width="1"/>
  <rect x="232.5" y="114.5" width="71" height="2.5" class="acc"/>
  <text x="239" y="127" class="t1" font-size="8" font-weight="bold">LIMITER</text>
  <circle cx="296" cy="124" r="3.5" class="acc"/>
  <text x="239" y="152" class="t1" font-size="11">-3 dB</text>

  <!-- FOOTSWITCH SUMMARY -->
  <rect x="4" y="164" width="152" height="32" rx="3" class="surface" stroke="#292A30" stroke-width="1"/>
  <text x="12" y="184" class="tm" font-size="9">FS1</text>
  <text x="148" y="184" class="t2" font-size="11" text-anchor="end">HARMONY</text>

  <rect x="164" y="164" width="152" height="32" rx="3" class="surface" stroke="#292A30" stroke-width="1"/>
  <text x="172" y="184" class="tm" font-size="9">FS2</text>
  <text x="308" y="184" class="t2" font-size="11" text-anchor="end">REVERB</text>

  <!-- NAVIGATION -->
  <rect y="204" width="320" height="36" class="nav"/>
  <rect x="0" y="204" width="80" height="2" class="acc"/>
  <text x="40" y="228" class="t1" font-size="11" font-weight="bold" text-anchor="middle">PERF</text>
  <text x="120" y="228" class="tm" font-size="11" text-anchor="middle">FX</text>
  <text x="200" y="228" class="tm" font-size="11" text-anchor="middle">PRESET</text>
  <text x="280" y="228" class="tm" font-size="11" text-anchor="middle">SET</text>
</svg>
