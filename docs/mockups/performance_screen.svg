<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="640" height="480">
  <defs>
    <!-- VoxP4 Control Surface Design System v2 -->
    <!-- Professional vocal processor interface for stage use -->
    <style>
      /* Backgrounds - Deep dark palette */
      .bg { fill: #090B0F; }
      .surface { fill: #121620; }
      .surface-elevated { fill: #191E2A; }
      .header { fill: #121620; }

      /* Borders */
      .border-subtle { stroke: #292F3D; stroke-width: 1; fill: none; }
      .border-active { stroke: #06B6D4; stroke-width: 2; fill: none; }

      /* Text Hierarchy - Optimized for stage readability */
      .text-primary { fill: #F2F5F7; font-family: Arial, sans-serif; font-size: 14px; }
      .text-secondary { fill: #A5ADBA; font-family: Arial, sans-serif; font-size: 12px; }
      .text-muted { fill: #687181; font-family: Arial, sans-serif; font-size: 11px; }
      .text-hero { fill: #F2F5F7; font-family: Arial, sans-serif; font-size: 32px; font-weight: bold; }
      .text-value { fill: #F2F5F7; font-family: Arial, sans-serif; font-size: 13px; font-weight: 600; }
      .text-accent { fill: #06B6D4; font-family: Arial, sans-serif; font-size: 13px; font-weight: 600; }
      .text-accent-bright { fill: #64F0FF; font-family: Arial, sans-serif; font-size: 11px; }
      .text-success { fill: #4CAF50; font-family: Arial, sans-serif; font-size: 11px; font-weight: 700; }
      .text-link-ok { fill: #66BB6A; font-family: Arial, sans-serif; font-size: 10px; font-weight: bold; }
      .text-link-lost { fill: #EF5350; font-family: Arial, sans-serif; font-size: 10px; font-weight: bold; }

      /* Effect Cards - Subtle active state, NOT full green */
      .effect-card-bg { fill: #121620; }
      .effect-card-active { fill: #191E2A; stroke: #06B6D4; stroke-width: 2; }
      .led-on { fill: #64F0FF; }
      .led-off { fill: #292F3D; }

      /* Meters - Horizontal with zones */
      .meter-bg { fill: #2A2F3D; }
      .meter-safe { fill: #00E676; }
      .meter-warning { fill: #FFD740; }
      .meter-clip { fill: #FF5252; }
      .meter-peak { stroke: #F2F5F7; stroke-width: 2; opacity: 0.8; }

      /* Status Indicators */
      .link-ok { fill: #66BB6A; }
      .link-lost { fill: #EF5350; }
      .fs-pressed { fill: #FFA726; }
      .fs-released { fill: #292F3D; }

      /* Navigation */
      .nav-tab { fill: #121620; }
      .nav-tab-active { fill: #191E2A; }
      .nav-indicator { fill: #06B6D4; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="320" height="240" class="bg"/>

  <!-- HEADER (28px) - Preset name + Link status -->
  <rect width="320" height="28" class="header"/>
  <text x="12" y="18" class="text-primary" font-size="13" font-weight="600">P03 Lead Air</text>

  <!-- Link Status Indicator (right side) -->
  <circle cx="286" cy="14" r="4" class="link-lost"/>
  <text x="296" y="17" class="text-link-lost">LINK LOST</text>

  <!-- METERS SECTION (60px) - Horizontal VU meters with zones -->
  <rect y="28" width="320" height="60" class="surface"/>

  <!-- Input Meter Row -->
  <text x="8" y="46" class="text-secondary" font-size="10" font-weight="600">IN</text>
  <rect x="34" y="36" width="206" height="14" rx="3" class="meter-bg"/>
  <!-- Safe zone (up to -12dB) -->
  <rect x="34" y="36" width="138" height="14" rx="3" class="meter-safe"/>
  <!-- Warning zone (-12 to -3dB) -->
  <rect x="172" y="36" width="34" height="14" rx="3" class="meter-warning"/>
  <!-- Clip zone (-3 to 0dB) -->
  <rect x="206" y="36" width="34" height="14" rx="3" class="meter-clip"/>
  <!-- Peak hold marker -->
  <line x1="165" y1="34" x2="165" y2="52" class="meter-peak"/>
  <text x="248" y="46" class="text-value">-8.2</text>

  <!-- Output Meter Row -->
  <text x="8" y="70" class="text-secondary" font-size="10" font-weight="600">OUT</text>
  <rect x="34" y="60" width="206" height="14" rx="3" class="meter-bg"/>
  <rect x="34" y="60" width="152" height="14" rx="3" class="meter-safe"/>
  <rect x="186" y="60" width="34" height="14" rx="3" class="meter-warning"/>
  <rect x="206" y="60" width="34" height="14" rx="3" class="meter-clip"/>
  <!-- Peak hold marker -->
  <line x1="192" y1="58" x2="192" y2="76" class="meter-peak"/>
  <text x="248" y="70" class="text-value">-5.1</text>

  <!-- PITCH SECTION (52px) - Musical hierarchy -->
  <rect y="88" width="320" height="52" class="surface-elevated"/>

  <!-- Note name (hero) - Most important musical data -->
  <text x="160" y="116" class="text-hero" text-anchor="middle">A3</text>

  <!-- Frequency (emphasis) -->
  <text x="160" y="132" class="text-accent-bright" text-anchor="middle" font-size="13">220.1 Hz</text>
  
  <!-- Voiced state (subtle but clear) -->
  <text x="160" y="146" class="text-success" text-anchor="middle">VOICED</text>

  <!-- EFFECT CARDS ROW (56px) - 4 effects with subtle active state -->
  <rect y="140" width="320" height="56" class="surface"/>

  <!-- HARMONY Card (ON) - Border accent + LED, NOT full green -->
  <rect x="6" y="144" width="74" height="48" rx="6" class="effect-card-active"/>
  <circle cx="14" cy="153" r="3" class="led-on"/>
  <text x="40" y="160" class="text-primary" text-anchor="middle" font-size="10" font-weight="700">HARMONY</text>
  <text x="40" y="178" class="text-accent-bright" text-anchor="middle" font-size="11">+3rd</text>

  <!-- REVERB Card (ON) -->
  <rect x="86" y="144" width="74" height="48" rx="6" class="effect-card-active"/>
  <circle cx="94" cy="153" r="3" class="led-on"/>
  <text x="120" y="160" class="text-primary" text-anchor="middle" font-size="10" font-weight="700">REVERB</text>
  <text x="120" y="178" class="text-accent-bright" text-anchor="middle" font-size="11">18%</text>

  <!-- LIMIT Card (ON) -->
  <rect x="166" y="144" width="74" height="48" rx="6" class="effect-card-active"/>
  <circle cx="174" cy="153" r="3" class="led-on"/>
  <text x="200" y="160" class="text-primary" text-anchor="middle" font-size="10" font-weight="700">LIMIT</text>
  <text x="200" y="178" class="text-accent-bright" text-anchor="middle" font-size="11">-3dB</text>

  <!-- DELAY Card (OFF) - Subtle, reduced contrast -->
  <rect x="246" y="144" width="68" height="48" rx="6" class="effect-card-bg" stroke="#292F3D" stroke-width="1"/>
  <circle cx="254" cy="153" r="3" class="led-off"/>
  <text x="280" y="160" class="text-secondary" text-anchor="middle" font-size="10" font-weight="700">DELAY</text>
  <text x="280" y="178" class="text-muted" text-anchor="middle" font-size="11">OFF</text>

  <!-- FOOTSWITCH BAR (36px) - Large touch targets -->
  <rect y="196" width="320" height="36" class="surface-elevated"/>

  <!-- FS1 Card -->
  <rect x="8" y="200" width="148" height="28" rx="4" class="nav-tab"/>
  <text x="16" y="218" class="text-muted" font-size="9" font-weight="600">FS1</text>
  <text x="72" y="218" class="text-primary" font-size="11" font-weight="700">HARMONY</text>

  <!-- FS2 Card -->
  <rect x="164" y="200" width="148" height="28" rx="4" class="nav-tab"/>
  <text x="172" y="218" class="text-muted" font-size="9" font-weight="600">FS2</text>
  <text x="228" y="218" class="text-primary" font-size="11" font-weight="700">REVERB</text>

  <!-- NAVIGATION BAR (20px) - 4 tabs -->
  <rect y="220" width="320" height="20" class="header"/>

  <!-- Active indicator bar for PERF tab (3px top border) -->
  <rect x="0" y="220" width="80" height="3" class="nav-indicator"/>

  <!-- Tab labels -->
  <text x="40" y="235" class="text-accent" text-anchor="middle" font-size="10" font-weight="700">PERF</text>
  <text x="120" y="235" class="text-secondary" text-anchor="middle" font-size="10">FX</text>
  <text x="200" y="235" class="text-secondary" text-anchor="middle" font-size="10">PRESET</text>
  <text x="280" y="235" class="text-secondary" text-anchor="middle" font-size="10">SET</text>
</svg>
