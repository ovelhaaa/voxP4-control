<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <style>
    .bg{fill:#090A0E}.surface{fill:#14151B}.header{fill:#101116}.nav{fill:#101116}.panel{fill:#202128}
    .t1{fill:#F0EDE5}.t2{fill:#B1ACA3}.tm{fill:#716E69}.tf{fill:#4A4947}
    .acc{fill:#F45126}.accb{fill:#FF6030}.accd{fill:#B83A1C}
    text{font-family:Arial,Helvetica,sans-serif}
  </style>

  <rect width="320" height="240" class="bg"/>

  <!-- HEADER -->
  <rect x="4" y="4" width="312" height="28" rx="3" class="header"/>
  <rect x="10" y="7" width="34" height="24" rx="3" class="surface" stroke="#292A30" stroke-width="1"/>
  <text x="27" y="23" class="t2" font-size="11" text-anchor="middle">&lt;</text>
  <text x="160" y="23" class="t1" font-size="12" font-weight="bold" text-anchor="middle">COMPRESSOR</text>
  <rect x="264" y="7" width="48" height="24" rx="3" class="accd"/>
  <text x="288" y="23" class="t1" font-size="10" text-anchor="middle">ON</text>

  <text x="10" y="45" class="tm" font-size="8">DETECTOR</text>

  <!-- THRESHOLD -->
  <rect x="4" y="46" width="312" height="38" rx="3" class="surface"/>
  <text x="14" y="60" class="tm" font-size="9">THRESHOLD</text>
  <text x="306" y="60" class="t1" font-size="11" text-anchor="end">-18.0 dB</text>
  <rect x="14" y="67" width="292" height="8" rx="3" class="panel"/>
  <rect x="14" y="67" width="204" height="8" rx="3" class="acc"/>
  <circle cx="218" cy="71" r="6" class="accb"/>

  <!-- RATIO -->
  <rect x="4" y="88" width="312" height="38" rx="3" class="surface"/>
  <text x="14" y="102" class="tm" font-size="9">RATIO</text>
  <text x="306" y="102" class="t1" font-size="11" text-anchor="end">3:1</text>
  <rect x="14" y="109" width="292" height="8" rx="3" class="panel"/>
  <rect x="14" y="109" width="31" height="8" rx="3" class="acc"/>
  <circle cx="45" cy="113" r="6" class="accb"/>

  <text x="10" y="134" class="tm" font-size="8">OUTPUT</text>

  <!-- MAKEUP -->
  <rect x="4" y="136" width="312" height="38" rx="3" class="surface"/>
  <text x="14" y="150" class="tm" font-size="9">MAKEUP</text>
  <text x="306" y="150" class="t1" font-size="11" text-anchor="end">+3.0 dB</text>
  <rect x="14" y="157" width="292" height="8" rx="3" class="panel"/>
  <rect x="14" y="157" width="37" height="8" rx="3" class="acc"/>
  <circle cx="51" cy="161" r="6" class="accb"/>

  <!-- ADVANCED collapsed: ATTACK / RELEASE / KNEE -->
  <rect x="4" y="178" width="312" height="26" rx="3" class="panel" stroke="#292A30" stroke-width="1"/>
  <text x="160" y="195" class="t2" font-size="11" text-anchor="middle">ADVANCED  v</text>

  <!-- NAVIGATION (FX active) -->
  <rect y="204" width="320" height="36" class="nav"/>
  <rect x="80" y="204" width="80" height="2" class="acc"/>
  <text x="40" y="228" class="tm" font-size="11" text-anchor="middle">PERF</text>
  <text x="120" y="228" class="t1" font-size="11" font-weight="bold" text-anchor="middle">FX</text>
  <text x="200" y="228" class="tm" font-size="11" text-anchor="middle">PRESET</text>
  <text x="280" y="228" class="tm" font-size="11" text-anchor="middle">SET</text>
</svg>
