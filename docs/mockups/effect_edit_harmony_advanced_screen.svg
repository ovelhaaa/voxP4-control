<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <style>
    .bg{fill:#090A0E}.surface{fill:#14151B}.header{fill:#101116}.nav{fill:#101116}.panel{fill:#202128}
    .t1{fill:#F0EDE5}.t2{fill:#B1ACA3}.tm{fill:#716E69}.tf{fill:#4A4947}
    .acc{fill:#F45126}.accb{fill:#FF6030}.accd{fill:#B83A1C}
    text{font-family:Arial,Helvetica,sans-serif}
  </style>

  <rect width="320" height="240" class="bg"/>

  <!-- HEADER -->
  <rect x="4" y="4" width="312" height="28" rx="3" class="header"/>
  <rect x="10" y="7" width="34" height="24" rx="3" class="surface" stroke="#292A30" stroke-width="1"/>
  <text x="27" y="23" class="t2" font-size="11" text-anchor="middle">&lt;</text>
  <text x="160" y="23" class="t1" font-size="12" font-weight="bold" text-anchor="middle">HARMONY</text>
  <rect x="264" y="7" width="48" height="24" rx="3" class="accd"/>
  <text x="288" y="23" class="t1" font-size="10" text-anchor="middle">ON</text>

  <!-- ADVANCED section opened (closed by default when entering an effect) -->
  <rect x="4" y="40" width="312" height="30" rx="3" class="panel" stroke="#292A30" stroke-width="1"/>
  <text x="160" y="59" class="t2" font-size="11" text-anchor="middle">ADVANCED  ^</text>

  <text x="10" y="82" class="tm" font-size="8">VOICE</text>

  <!-- SMOOTHING -->
  <rect x="4" y="84" width="312" height="34" rx="3" class="surface"/>
  <text x="14" y="97" class="tm" font-size="9">SMOOTHING</text>
  <text x="306" y="97" class="t1" font-size="11" text-anchor="end">30 ms</text>
  <rect x="14" y="104" width="292" height="8" rx="3" class="panel"/>
  <rect x="14" y="104" width="17" height="8" rx="3" class="acc"/>
  <circle cx="31" cy="108" r="6" class="accb"/>

  <text x="10" y="130" class="tm" font-size="8">DRY ALIGN</text>

  <!-- DRY ALIGNMENT enable (delay ms appears when enabled) -->
  <rect x="4" y="132" width="312" height="34" rx="3" class="surface"/>
  <text x="14" y="153" class="tm" font-size="9">ENABLE</text>
  <rect x="248" y="136" width="56" height="26" rx="3" class="surface" stroke="#292A30" stroke-width="1"/>
  <text x="276" y="153" class="tm" font-size="10" text-anchor="middle">OFF</text>

  <text x="10" y="180" class="tm" font-size="8">HARM LIMITER</text>

  <!-- Harmony bus limiter (NOT the master limiter) -->
  <rect x="4" y="182" width="312" height="22" rx="3" class="surface"/>
  <text x="14" y="198" class="tm" font-size="9">ENABLE</text>
  <rect x="248" y="182" width="56" height="22" rx="3" class="accd"/>
  <text x="276" y="197" class="t1" font-size="10" text-anchor="middle">ON</text>

  <!-- MIDI RANGE and limiter THRESHOLD continue below the fold -->

  <!-- NAVIGATION (FX active) -->
  <rect y="204" width="320" height="36" class="nav"/>
  <rect x="80" y="204" width="80" height="2" class="acc"/>
  <text x="40" y="228" class="tm" font-size="11" text-anchor="middle">PERF</text>
  <text x="120" y="228" class="t1" font-size="11" font-weight="bold" text-anchor="middle">FX</text>
  <text x="200" y="228" class="tm" font-size="11" text-anchor="middle">PRESET</text>
  <text x="280" y="228" class="tm" font-size="11" text-anchor="middle">SET</text>
</svg>
