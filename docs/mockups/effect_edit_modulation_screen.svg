<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <style>
    .bg{fill:#090A0E}.surface{fill:#14151B}.elev{fill:#1C1D24}.header{fill:#101116}.nav{fill:#101116}.panel{fill:#202128}
    .t1{fill:#F0EDE5}.t2{fill:#B1ACA3}.tm{fill:#716E69}.tf{fill:#4A4947}
    .acc{fill:#F45126}.accb{fill:#FF6030}.accd{fill:#B83A1C}
    text{font-family:Arial,Helvetica,sans-serif}
  </style>

  <rect width="320" height="240" class="bg"/>

  <!-- HEADER -->
  <rect x="4" y="4" width="312" height="28" rx="3" class="header"/>
  <rect x="10" y="7" width="34" height="24" rx="3" class="surface" stroke="#292A30" stroke-width="1"/>
  <text x="27" y="23" class="t2" font-size="11" text-anchor="middle">&lt;</text>
  <text x="160" y="23" class="t1" font-size="12" font-weight="bold" text-anchor="middle">MODULATION</text>
  <rect x="264" y="7" width="48" height="24" rx="3" class="accd"/>
  <text x="288" y="23" class="t1" font-size="10" text-anchor="middle">ON</text>

  <text x="10" y="45" class="tm" font-size="8">MODE</text>

  <!-- MODE (CHORUS / ENSEMBLE / DIMENSION / MICROSHIFT) -->
  <rect x="4" y="46" width="312" height="46" rx="3" class="surface"/>
  <text x="14" y="60" class="tm" font-size="9">MODE</text>
  <text x="306" y="60" class="accb" font-size="11" text-anchor="end">CHORUS</text>
  <rect x="14" y="66" width="68" height="22" rx="3" class="elev" stroke="#F45126" stroke-width="1"/>
  <text x="48" y="81" class="accb" font-size="8" text-anchor="middle">CHORUS</text>
  <rect x="86" y="66" width="68" height="22" rx="3" class="panel" stroke="#292A30" stroke-width="1"/>
  <text x="120" y="81" class="t2" font-size="8" text-anchor="middle">ENSEMBLE</text>
  <rect x="158" y="66" width="68" height="22" rx="3" class="panel" stroke="#292A30" stroke-width="1"/>
  <text x="192" y="81" class="t2" font-size="8" text-anchor="middle">DIMENSION</text>
  <rect x="230" y="66" width="70" height="22" rx="3" class="panel" stroke="#292A30" stroke-width="1"/>
  <text x="265" y="81" class="t2" font-size="8" text-anchor="middle">MICROSHIFT</text>

  <text x="10" y="102" class="tm" font-size="8">MODULATION</text>

  <!-- MIX -->
  <rect x="4" y="104" width="312" height="38" rx="3" class="surface"/>
  <text x="14" y="118" class="tm" font-size="9">MIX</text>
  <text x="306" y="118" class="t1" font-size="11" text-anchor="end">30%</text>
  <rect x="14" y="125" width="292" height="8" rx="3" class="panel"/>
  <rect x="14" y="125" width="88" height="8" rx="3" class="acc"/>
  <circle cx="102" cy="129" r="6" class="accb"/>

  <text x="10" y="152" class="tm" font-size="8">LFO</text>

  <!-- RATE (shown while TEMPO SYNC is OFF; DIVISION replaces it when ON) -->
  <rect x="4" y="154" width="312" height="38" rx="3" class="surface"/>
  <text x="14" y="168" class="tm" font-size="9">RATE</text>
  <text x="306" y="168" class="t1" font-size="11" text-anchor="end">0.75 Hz</text>
  <rect x="14" y="175" width="292" height="8" rx="3" class="panel"/>
  <rect x="14" y="175" width="21" height="8" rx="3" class="acc"/>
  <circle cx="35" cy="179" r="6" class="accb"/>

  <!-- DEPTH / WIDTH below the fold; TEMPO SYNC + BASE DELAY are Advanced -->
  <rect x="4" y="196" width="312" height="38" rx="3" class="surface"/>

  <!-- NAVIGATION (FX active) -->
  <rect y="204" width="320" height="36" class="nav"/>
  <rect x="80" y="204" width="80" height="2" class="acc"/>
  <text x="40" y="228" class="tm" font-size="11" text-anchor="middle">PERF</text>
  <text x="120" y="228" class="t1" font-size="11" font-weight="bold" text-anchor="middle">FX</text>
  <text x="200" y="228" class="tm" font-size="11" text-anchor="middle">PRESET</text>
  <text x="280" y="228" class="tm" font-size="11" text-anchor="middle">SET</text>
</svg>
