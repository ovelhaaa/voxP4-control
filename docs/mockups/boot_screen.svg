<?xml version="1.0" encoding="UTF-8"?>
<svg width="320" height="240" viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Boot Screen - Initial State -->
  <defs>
    <style>
      .bg { fill: #000000; }
      .text-title { fill: #FFFFFF; font-family: monospace; font-size: 16px; font-weight: bold; }
      .text-subtitle { fill: #AAAAAA; font-family: monospace; font-size: 12px; }
      .text-status { fill: #4CAF50; font-family: monospace; font-size: 11px; }
      .border { fill: none; stroke: #333333; stroke-width: 1; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect class="bg" width="320" height="240"/>
  
  <!-- Header box -->
  <rect x="10" y="10" width="300" height="60" rx="4" fill="#1A1A2E" stroke="#333344" stroke-width="1"/>
  
  <!-- Title -->
  <text x="160" y="35" text-anchor="middle" class="text-title">VoxP4 Control</text>
  <text x="160" y="52" text-anchor="middle" class="text-subtitle">ESP32 CYD Firmware</text>
  
  <!-- Hardware info -->
  <text x="20" y="90" class="text-subtitle">Hardware: ESP32-2432S028R (2-USB)</text>
  <text x="20" y="110" class="text-subtitle">Display: ST7789 320×240 landscape</text>
  <text x="20" y="130" class="text-subtitle">Touch: XPT2046 resistivo</text>
  <text x="20" y="150" class="text-subtitle">UART VoxLink: TX=18 RX=19 @ 921600</text>
  
  <!-- Initialization status -->
  <rect x="10" y="170" width="300" height="50" rx="4" fill="#0F0F1A" stroke="#333344" stroke-width="1"/>
  <text x="20" y="195" class="text-status">[INIT] Display... OK</text>
  <text x="20" y="210" class="text-status">[INIT] Touch... OK</text>
  <text x="170" y="195" class="text-status">[INIT] LVGL... OK</text>
  <text x="170" y="210" class="text-status">[INIT] System ready!</text>
</svg>
