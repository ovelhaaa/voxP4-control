<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="640" height="480">
  <defs>
    <style>
      .bg { fill: #090B0F; }
      .surface { fill: #121620; }
      .surface-elevated { fill: #191E2A; }
      .header { fill: #121620; }
      .text-primary { fill: #F2F5F7; font-family: Arial, sans-serif; font-size: 14px; }
      .text-secondary { fill: #A5ADBA; font-family: Arial, sans-serif; font-size: 12px; }
      .text-muted { fill: #687181; font-family: Arial, sans-serif; font-size: 11px; }
      .text-accent { fill: #00E5FF; font-family: Arial, sans-serif; font-size: 14px; }
      .effect-card-bg { fill: #191E2A; }
      .effect-card-active { fill: #191E2A; stroke: #00E5FF; stroke-width: 2; }
      .led-on { fill: #00E5FF; }
      .arrow { fill: #00E5FF; }
      .nav-tab { fill: #121620; }
      .nav-tab-active { fill: #191E2A; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="320" height="240" class="bg"/>
  
  <!-- HEADER (28px) -->
  <rect width="320" height="28" class="header"/>
  <text x="10" y="19" class="text-primary" font-size="14" font-weight="bold">FX CHAIN</text>
  
  <!-- FX Chain - Horizontal flow with cards -->
  
  <!-- INPUT Card -->
  <rect x="8" y="36" width="60" height="44" rx="6" class="surface-elevated"/>
  <text x="38" y="56" class="text-primary" text-anchor="middle" font-size="10" font-weight="bold">INPUT</text>
  <text x="38" y="70" class="text-muted" text-anchor="middle" font-size="9">MIC/LINE</text>
  
  <!-- Arrow -->
  <polygon points="76,58 70,54 70,62" class="arrow"/>
  
  <!-- PITCH Card -->
  <rect x="84" y="36" width="60" height="44" rx="6" class="effect-card-active"/>
  <circle cx="92" cy="44" r="3" class="led-on"/>
  <text x="114" y="56" class="text-primary" text-anchor="middle" font-size="10" font-weight="bold">PITCH</text>
  <text x="114" y="70" class="text-accent" text-anchor="middle" font-size="9">A3 220Hz</text>
  
  <!-- Arrow -->
  <polygon points="152,58 146,54 146,62" class="arrow"/>
  
  <!-- HARMONY Card -->
  <rect x="160" y="36" width="60" height="44" rx="6" class="effect-card-active"/>
  <circle cx="168" cy="44" r="3" class="led-on"/>
  <text x="190" y="56" class="text-primary" text-anchor="middle" font-size="10" font-weight="bold">HARMONY</text>
  <text x="190" y="70" class="text-accent" text-anchor="middle" font-size="9">+3rd</text>
  
  <!-- Arrow -->
  <polygon points="228,58 222,54 222,62" class="arrow"/>
  
  <!-- DYNAMICS Card -->
  <rect x="236" y="36" width="76" height="44" rx="6" class="effect-card-active"/>
  <circle cx="244" cy="44" r="3" class="led-on"/>
  <text x="274" y="56" class="text-primary" text-anchor="middle" font-size="10" font-weight="bold">DYNAMICS</text>
  <text x="274" y="70" class="text-accent" text-anchor="middle" font-size="9">-3dB GR</text>
  
  <!-- Row 2 -->
  
  <!-- REVERB Card -->
  <rect x="8" y="88" width="60" height="44" rx="6" class="effect-card-active"/>
  <circle cx="16" cy="96" r="3" class="led-on"/>
  <text x="38" y="108" class="text-primary" text-anchor="middle" font-size="10" font-weight="bold">REVERB</text>
  <text x="38" y="122" class="text-accent" text-anchor="middle" font-size="9">Plate 18%</text>
  
  <!-- Arrow -->
  <polygon points="76,110 70,106 70,114" class="arrow"/>
  
  <!-- DELAY Card -->
  <rect x="84" y="88" width="60" height="44" rx="6" class="effect-card-bg" stroke="#292F3D" stroke-width="1"/>
  <circle cx="92" cy="96" r="3" class="led-off" fill="#292F3D"/>
  <text x="114" y="108" class="text-secondary" text-anchor="middle" font-size="10" font-weight="bold">DELAY</text>
  <text x="114" y="122" class="text-muted" text-anchor="middle" font-size="9">OFF</text>
  
  <!-- Arrow -->
  <polygon points="152,110 146,106 146,114" class="arrow"/>
  
  <!-- LIMITER Card -->
  <rect x="160" y="88" width="60" height="44" rx="6" class="effect-card-active"/>
  <circle cx="168" cy="96" r="3" class="led-on"/>
  <text x="190" y="108" class="text-primary" text-anchor="middle" font-size="10" font-weight="bold">LIMITER</text>
  <text x="190" y="122" class="text-accent" text-anchor="middle" font-size="9">Ceiling 0dB</text>
  
  <!-- Arrow -->
  <polygon points="228,110 222,106 222,114" class="arrow"/>
  
  <!-- OUTPUT Card -->
  <rect x="236" y="88" width="76" height="44" rx="6" class="surface-elevated"/>
  <text x="274" y="108" class="text-primary" text-anchor="middle" font-size="10" font-weight="bold">OUTPUT</text>
  <text x="274" y="122" class="text-muted" text-anchor="middle" font-size="9">MAIN L/R</text>
  
  <!-- Tap hint -->
  <text x="160" y="148" class="text-muted" text-anchor="middle" font-size="10">Tap card to edit parameters</text>
  
  <!-- Quick toggles row -->
  <rect x="8" y="160" width="304" height="52" class="surface"/>
  <text x="16" y="180" class="text-secondary" font-size="11">QUICK TOGGLES</text>
  
  <!-- Toggle buttons -->
  <rect x="16" y="188" width="56" height="20" rx="4" class="effect-card-active"/>
  <text x="44" y="202" class="text-primary" text-anchor="middle" font-size="9">ALL ON</text>
  
  <rect x="80" y="188" width="56" height="20" rx="4" class="effect-card-bg" stroke="#292F3D" stroke-width="1"/>
  <text x="108" y="202" class="text-secondary" text-anchor="middle" font-size="9">BYPASS</text>
  
  <!-- NAVIGATION BAR (20px) -->
  <rect y="220" width="320" height="20" class="header"/>
  
  <rect x="0" y="220" width="80" height="20" class="nav-tab"/>
  <text x="40" y="234" class="text-secondary" text-anchor="middle" font-size="10">PERF</text>
  
  <rect x="80" y="220" width="80" height="20" class="nav-tab-active"/>
  <text x="120" y="234" class="text-accent" text-anchor="middle" font-size="10" font-weight="bold">FX</text>
  
  <rect x="160" y="220" width="80" height="20" class="nav-tab"/>
  <text x="200" y="234" class="text-secondary" text-anchor="middle" font-size="10">PRESET</text>
  
  <rect x="240" y="220" width="80" height="20" class="nav-tab"/>
  <text x="280" y="234" class="text-secondary" text-anchor="middle" font-size="10">SET</text>
</svg>
