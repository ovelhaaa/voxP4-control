<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <style>
    .bg{fill:#090A0E}.surface{fill:#14151B}.header{fill:#101116}.nav{fill:#101116}
    .t1{fill:#F0EDE5}.t2{fill:#B1ACA3}.tm{fill:#716E69}.tf{fill:#4A4947}
    .acc{fill:#F45126}.accb{fill:#FF6030}.accd{fill:#B83A1C}
    .aud{fill:#20D6C7}.audd{fill:#148E87}
    .dis{fill:#414147}
    text{font-family:Arial,Helvetica,sans-serif}
  </style>

  <rect width="320" height="240" class="bg"/>

  <!-- HEADER -->
  <rect x="4" y="4" width="312" height="24" rx="3" class="header"/>
  <text x="12" y="20.5" class="t1" font-size="13" font-weight="bold">FX CHAIN</text>

  <!-- MODULE RACK (4 modules, y 45..129) -->
  <!-- HARMONY ON -->
  <rect x="4" y="45" width="74" height="84" rx="5" class="surface" stroke="#B83A1C" stroke-width="1"/>
  <circle cx="13" cy="56.5" r="4" class="acc"/>
  <text x="21" y="61" class="t1" font-size="9">HARMONY</text>
  <line x1="9" y1="67" x2="73" y2="67" stroke="#292A30" stroke-width="1"/>
  <text x="41" y="98" class="t1" font-size="16" font-weight="bold" text-anchor="middle">+3rd</text>
  <line x1="9" y1="106" x2="73" y2="106" stroke="#292A30" stroke-width="1"/>
  <text x="41" y="121" class="t2" font-size="9" text-anchor="middle">KEY AUTO</text>

  <!-- REVERB ON -->
  <rect x="83" y="45" width="74" height="84" rx="5" class="surface" stroke="#B83A1C" stroke-width="1"/>
  <circle cx="92" cy="56.5" r="4" class="acc"/>
  <text x="100" y="61" class="t1" font-size="9">REVERB</text>
  <line x1="88" y1="67" x2="152" y2="67" stroke="#292A30" stroke-width="1"/>
  <text x="120" y="98" class="t1" font-size="16" font-weight="bold" text-anchor="middle">18%</text>
  <line x1="88" y1="106" x2="152" y2="106" stroke="#292A30" stroke-width="1"/>
  <text x="120" y="121" class="t2" font-size="9" text-anchor="middle">PLATE</text>

  <!-- DELAY OFF -->
  <rect x="163" y="45" width="74" height="84" rx="5" class="surface" stroke="#292A30" stroke-width="1"/>
  <circle cx="172" cy="56.5" r="4" class="dis"/>
  <text x="180" y="61" class="t2" font-size="9">DELAY</text>
  <line x1="168" y1="67" x2="232" y2="67" stroke="#292A30" stroke-width="1"/>
  <text x="200" y="98" class="tm" font-size="16" font-weight="bold" text-anchor="middle">--</text>
  <line x1="168" y1="106" x2="232" y2="106" stroke="#292A30" stroke-width="1"/>
  <text x="200" y="121" class="tf" font-size="9" text-anchor="middle">1/4</text>

  <!-- LIMITER ON -->
  <rect x="242" y="45" width="74" height="84" rx="5" class="surface" stroke="#B83A1C" stroke-width="1"/>
  <circle cx="251" cy="56.5" r="4" class="acc"/>
  <text x="259" y="61" class="t1" font-size="9">LIMITER</text>
  <line x1="247" y1="67" x2="311" y2="67" stroke="#292A30" stroke-width="1"/>
  <text x="279" y="98" class="t1" font-size="16" font-weight="bold" text-anchor="middle">-3 dB</text>
  <line x1="247" y1="106" x2="311" y2="106" stroke="#292A30" stroke-width="1"/>
  <text x="279" y="121" class="t2" font-size="9" text-anchor="middle">THRESHOLD</text>

  <!-- DIVIDER above global actions -->
  <line x1="4" y1="145" x2="316" y2="145" stroke="#292A30" stroke-width="1"/>

  <!-- GLOBAL ACTIONS (y 152..200) -->
  <rect x="6" y="152" width="150" height="48" rx="3" fill="none" stroke="#148E87" stroke-width="1"/>
  <text x="81" y="172" class="aud" font-size="14" font-weight="bold" text-anchor="middle">ALL ON</text>
  <text x="81" y="187" class="tm" font-size="9" text-anchor="middle">ENABLE ALL EFFECTS</text>

  <rect x="164" y="152" width="150" height="48" rx="3" class="surface" stroke="#F45126" stroke-width="1"/>
  <text x="239" y="172" class="t1" font-size="14" font-weight="bold" text-anchor="middle">BYPASS</text>
  <text x="239" y="187" class="tm" font-size="9" text-anchor="middle">DISABLE ALL EFFECTS</text>

  <!-- NAVIGATION (FX active) -->
  <rect y="204" width="320" height="36" class="nav"/>
  <rect x="80" y="204" width="80" height="3" class="acc"/>
  <text x="40" y="228" class="tm" font-size="11" text-anchor="middle">PERF</text>
  <text x="120" y="228" class="t1" font-size="11" font-weight="bold" text-anchor="middle">FX</text>
  <text x="200" y="228" class="tm" font-size="11" text-anchor="middle">PRESET</text>
  <text x="280" y="228" class="tm" font-size="11" text-anchor="middle">SET</text>
</svg>
