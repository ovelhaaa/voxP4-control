<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="640" height="480">
  <defs>
    <style>
      .bg { fill: #121212; }
      .card { fill: #1E1E2E; }
      .header { fill: #2A2A3A; }
      .text-primary { fill: #FFFFFF; font-family: Arial, sans-serif; font-size: 14px; }
      .text-secondary { fill: #B0B0B0; font-family: Arial, sans-serif; font-size: 12px; }
      .text-small { fill: #707070; font-family: Arial, sans-serif; font-size: 10px; }
      .effect-off { fill: #424242; }
      .effect-on { fill: #4CAF50; }
      .arrow { fill: #66BB6A; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="320" height="240" class="bg"/>
  
  <!-- HEADER -->
  <rect width="320" height="32" class="header"/>
  <text x="16" y="22" class="text-primary" font-size="16" font-weight="bold">FX CHAIN</text>
  
  <!-- FX Chain Flow -->
  
  <!-- INPUT -->
  <rect x="80" y="40" width="160" height="28" class="card" rx="6"/>
  <text x="160" y="60" class="text-primary" text-anchor="middle" font-size="12">INPUT</text>
  
  <!-- Arrow -->
  <polygon points="160,68 154,78 166,78" class="arrow"/>
  
  <!-- PITCH -->
  <rect x="80" y="82" width="160" height="28" class="effect-on" rx="6"/>
  <text x="160" y="102" class="text-primary" text-anchor="middle" font-size="12">PITCH DETECT</text>
  
  <!-- Arrow -->
  <polygon points="160,110 154,120 166,120" class="arrow"/>
  
  <!-- HARMONY -->
  <rect x="80" y="124" width="160" height="28" class="effect-on" rx="6"/>
  <text x="160" y="140" class="text-primary" text-anchor="middle" font-size="11">HARMONY</text>
  <text x="160" y="152" class="text-small" text-anchor="middle">+3rd / -9.0 dB</text>
  
  <!-- Arrow -->
  <polygon points="160,152 154,162 166,162" class="arrow"/>
  
  <!-- DYNAMICS -->
  <rect x="80" y="166" width="160" height="28" class="effect-on" rx="6"/>
  <text x="160" y="182" class="text-primary" text-anchor="middle" font-size="11">DYNAMICS</text>
  <text x="160" y="194" class="text-small" text-anchor="middle">Comp: -3.2 dB</text>
  
  <!-- Arrow -->
  <polygon points="160,194 154,204 166,204" class="arrow"/>
  
  <!-- REVERB -->
  <rect x="80" y="208" width="160" height="28" class="effect-on" rx="6"/>
  <text x="160" y="224" class="text-primary" text-anchor="middle" font-size="11">REVERB</text>
  <text x="160" y="236" class="text-small" text-anchor="middle">Plate 35%</text>
  
  <!-- Note: This screen would scroll or use pagination for full chain -->
  <!-- Visual indicator that there are more effects below -->
  <text x="160" y="238" class="text-small" text-anchor="middle">▼ More</text>
</svg>
