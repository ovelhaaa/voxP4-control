<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <style>
    .bg{fill:#090A0E}.surface{fill:#14151B}.elev{fill:#1C1D24}.header{fill:#101116}.nav{fill:#101116}.panel{fill:#202128}
    .t1{fill:#F0EDE5}.t2{fill:#B1ACA3}.tm{fill:#716E69}.tf{fill:#4A4947}
    .acc{fill:#F45126}.accb{fill:#FF6030}.accd{fill:#B83A1C}
    text{font-family:Arial,Helvetica,sans-serif}
  </style>

  <rect width="320" height="240" class="bg"/>

  <!-- HEADER -->
  <rect x="4" y="4" width="312" height="28" rx="3" class="header"/>
  <rect x="10" y="7" width="34" height="24" rx="3" class="surface" stroke="#292A30" stroke-width="1"/>
  <text x="27" y="23" class="t2" font-size="11" text-anchor="middle">&lt;</text>
  <text x="160" y="23" class="t1" font-size="12" font-weight="bold" text-anchor="middle">DELAY</text>
  <rect x="264" y="7" width="48" height="24" rx="3" class="accd"/>
  <text x="288" y="23" class="t1" font-size="10" text-anchor="middle">ON</text>

  <!-- TEMPO SYNC section -->
  <text x="10" y="46" class="tm" font-size="8">SYNC</text>
  <rect x="4" y="48" width="312" height="40" rx="3" class="surface"/>
  <text x="14" y="72" class="tm" font-size="9">TEMPO SYNC</text>
  <rect x="248" y="55" width="56" height="26" rx="3" class="accd"/>
  <text x="276" y="73" class="t1" font-size="10" text-anchor="middle">ON</text>

  <!-- TIME section: with sync ON, times become canonical subdivisions -->
  <text x="10" y="100" class="tm" font-size="8">TIME</text>

  <!-- LEFT DIVISION (stepper) -->
  <rect x="4" y="102" width="312" height="44" rx="3" class="surface"/>
  <text x="14" y="116" class="tm" font-size="9">LEFT DIV</text>
  <rect x="14" y="121" width="44" height="22" rx="3" class="panel" stroke="#292A30" stroke-width="1"/>
  <text x="36" y="136" class="t2" font-size="11" text-anchor="middle">&lt;</text>
  <text x="160" y="137" class="t1" font-size="12" text-anchor="middle">1/8</text>
  <rect x="262" y="121" width="44" height="22" rx="3" class="panel" stroke="#292A30" stroke-width="1"/>
  <text x="284" y="136" class="t2" font-size="11" text-anchor="middle">&gt;</text>

  <!-- RIGHT DIVISION (stepper) -->
  <rect x="4" y="150" width="312" height="44" rx="3" class="surface"/>
  <text x="14" y="164" class="tm" font-size="9">RIGHT DIV</text>
  <rect x="14" y="169" width="44" height="22" rx="3" class="panel" stroke="#292A30" stroke-width="1"/>
  <text x="36" y="184" class="t2" font-size="11" text-anchor="middle">&lt;</text>
  <text x="160" y="185" class="t1" font-size="12" text-anchor="middle">1/8.</text>
  <rect x="262" y="169" width="44" height="22" rx="3" class="panel" stroke="#292A30" stroke-width="1"/>
  <text x="284" y="184" class="t2" font-size="11" text-anchor="middle">&gt;</text>

  <!-- FEEDBACK below the fold; body scrolls. With sync OFF, LEFT/RIGHT show ms instead. -->
  <rect x="4" y="198" width="312" height="38" rx="3" class="surface"/>

  <!-- NAVIGATION (FX active) -->
  <rect y="204" width="320" height="36" class="nav"/>
  <rect x="80" y="204" width="80" height="2" class="acc"/>
  <text x="40" y="228" class="tm" font-size="11" text-anchor="middle">PERF</text>
  <text x="120" y="228" class="t1" font-size="11" font-weight="bold" text-anchor="middle">FX</text>
  <text x="200" y="228" class="tm" font-size="11" text-anchor="middle">PRESET</text>
  <text x="280" y="228" class="tm" font-size="11" text-anchor="middle">SET</text>
</svg>
