<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="640" height="480">
  <defs>
    <style>
      .bg { fill: #121212; }
      .card { fill: #1E1E2E; }
      .header { fill: #2A2A3A; }
      .text-primary { fill: #FFFFFF; font-family: Arial, sans-serif; font-size: 14px; }
      .text-secondary { fill: #B0B0B0; font-family: Arial, sans-serif; font-size: 12px; }
      .text-value { fill: #64B5F6; font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; }
      .slider-bg { fill: #303030; }
      .slider-knob { fill: #64B5F6; }
      .btn { fill: #424242; }
      .btn-active { fill: #4CAF50; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="320" height="240" class="bg"/>
  
  <!-- HEADER with back button and toggle -->
  <rect width="320" height="32" class="header"/>
  <text x="12" y="22" class="text-primary" font-size="18">◀</text>
  <text x="36" y="22" class="text-primary" font-size="14" font-weight="bold">HARMONY</text>
  
  <!-- ON/OFF Toggle -->
  <rect x="270" y="8" width="40" height="20" rx="10" class="btn-active"/>
  <circle cx="300" cy="18" r="8" fill="#FFFFFF"/>
  
  <!-- PARAMETER 1: INTERVAL -->
  <rect x="8" y="40" width="304" height="50" class="card" rx="8"/>
  <text x="16" y="60" class="text-secondary">INTERVAL</text>
  <text x="304" y="60" class="text-value" text-anchor="end">+3rd</text>
  
  <!-- Slider track -->
  <rect x="16" y="68" width="272" height="12" rx="6" class="slider-bg"/>
  <rect x="96" y="68" width="12" height="12" rx="6" class="slider-knob"/>
  
  <!-- Min/Max labels -->
  <text x="16" y="88" class="text-secondary" font-size="10">-12</text>
  <text x="272" y="88" class="text-secondary" font-size="10">+12</text>
  
  <!-- PARAMETER 2: LEVEL -->
  <rect x="8" y="96" width="304" height="50" class="card" rx="8"/>
  <text x="16" y="116" class="text-secondary">LEVEL</text>
  <text x="304" y="116" class="text-value" text-anchor="end">-9.0 dB</text>
  
  <!-- Slider track -->
  <rect x="16" y="124" width="272" height="12" rx="6" class="slider-bg"/>
  <rect x="150" y="124" width="12" height="12" rx="6" class="slider-knob"/>
  
  <!-- Min/Max labels -->
  <text x="16" y="144" class="text-secondary" font-size="10">-∞</text>
  <text x="272" y="144" class="text-secondary" font-size="10">+6</text>
  
  <!-- PARAMETER 3: PAN (Segmented buttons) -->
  <rect x="8" y="152" width="304" height="44" class="card" rx="8"/>
  <text x="16" y="172" class="text-secondary">PAN</text>
  
  <!-- Segmented buttons -->
  <rect x="140" y="158" width="50" height="32" rx="6" class="btn-active"/>
  <text x="165" y="180" class="text-primary" text-anchor="middle" font-size="12">CENTER</text>
  
  <rect x="200" y="158" width="50" height="32" rx="6" class="btn"/>
  <text x="225" y="180" class="text-primary" text-anchor="middle" font-size="12">RIGHT</text>
  
  <rect x="80" y="158" width="50" height="32" rx="6" class="btn"/>
  <text x="105" y="180" class="text-primary" text-anchor="middle" font-size="12">LEFT</text>
  
  <!-- Page indicator -->
  <text x="160" y="220" class="text-secondary" text-anchor="middle" font-size="11">Page 1/2  ▶▶</text>
</svg>
