<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="640" height="480">
  <defs>
    <style>
      .bg { fill: #090B0F; }
      .surface { fill: #121620; }
      .surface-elevated { fill: #191E2A; }
      .header { fill: #121620; }
      .text-primary { fill: #F2F5F7; font-family: Arial, sans-serif; font-size: 14px; }
      .text-secondary { fill: #A5ADBA; font-family: Arial, sans-serif; font-size: 12px; }
      .text-muted { fill: #687181; font-family: Arial, sans-serif; font-size: 11px; }
      .text-value { fill: #00E5FF; font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; }
      .slider-bg { fill: #292F3D; }
      .slider-fill { fill: #00E5FF; }
      .btn { fill: #191E2A; stroke: #292F3D; stroke-width: 1; }
      .btn-active { fill: #00E5FF; }
      .effect-card-active { fill: #191E2A; stroke: #00E5FF; stroke-width: 2; }
      .led-on { fill: #00E5FF; }
      .nav-tab { fill: #121620; }
      .nav-tab-active { fill: #191E2A; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="320" height="240" class="bg"/>
  
  <!-- HEADER (28px) with back and toggle -->
  <rect width="320" height="28" class="header"/>
  <text x="8" y="19" class="text-primary" font-size="16">◀</text>
  <text x="28" y="19" class="text-primary" font-size="14" font-weight="bold">HARMONY</text>
  
  <!-- ON/OFF Toggle (right side) -->
  <rect x="278" y="8" width="34" height="18" rx="9" class="btn-active"/>
  <circle cx="303" cy="17" r="7" fill="#090B0F"/>
  
  <!-- PARAMETER 1: INTERVAL (56px) -->
  <rect x="8" y="36" width="304" height="56" rx="6" class="surface"/>
  <text x="16" y="56" class="text-secondary" font-size="11">INTERVAL</text>
  <text x="304" y="56" class="text-value" text-anchor="end" font-size="16">+3rd</text>
  
  <!-- Slider track -->
  <rect x="16" y="64" width="272" height="10" rx="5" class="slider-bg"/>
  <rect x="96" y="64" width="40" height="10" rx="5" class="slider-fill"/>
  <circle cx="136" cy="69" r="6" fill="#F2F5F7"/>
  
  <!-- Min/Max labels -->
  <text x="16" y="86" class="text-muted" font-size="9">-12</text>
  <text x="272" y="86" class="text-muted" font-size="9">+12</text>
  
  <!-- PARAMETER 2: LEVEL (56px) -->
  <rect x="8" y="98" width="304" height="56" rx="6" class="surface"/>
  <text x="16" y="118" class="text-secondary" font-size="11">LEVEL</text>
  <text x="304" y="118" class="text-value" text-anchor="end" font-size="16">-9.0 dB</text>
  
  <!-- Slider track -->
  <rect x="16" y="126" width="272" height="10" rx="5" class="slider-bg"/>
  <rect x="120" y="126" width="30" height="10" rx="5" class="slider-fill"/>
  <circle cx="150" cy="131" r="6" fill="#F2F5F7"/>
  
  <!-- Min/Max labels -->
  <text x="16" y="148" class="text-muted" font-size="9">-∞</text>
  <text x="272" y="148" class="text-muted" font-size="9">+6</text>
  
  <!-- PARAMETER 3: PAN - Segmented buttons (52px) -->
  <rect x="8" y="160" width="304" height="52" rx="6" class="surface"/>
  <text x="16" y="180" class="text-secondary" font-size="11">PAN</text>
  
  <!-- Segmented buttons -->
  <rect x="80" y="166" width="60" height="28" rx="4" class="btn"/>
  <text x="110" y="184" class="text-secondary" text-anchor="middle" font-size="10">LEFT</text>
  
  <rect x="146" y="166" width="60" height="28" rx="4" class="btn-active"/>
  <text x="176" y="184" class="text-primary" text-anchor="middle" font-size="10" font-weight="bold">CENTER</text>
  
  <rect x="212" y="166" width="60" height="28" rx="4" class="btn"/>
  <text x="242" y="184" class="text-secondary" text-anchor="middle" font-size="10">RIGHT</text>
  
  <!-- Page indicator -->
  <text x="160" y="210" class="text-muted" text-anchor="middle" font-size="10">Page 1/2</text>
  
  <!-- NAVIGATION BAR (20px) -->
  <rect y="220" width="320" height="20" class="header"/>
  
  <rect x="0" y="220" width="80" height="20" class="nav-tab"/>
  <text x="40" y="234" class="text-secondary" text-anchor="middle" font-size="10">PERF</text>
  
  <rect x="80" y="220" width="80" height="20" class="nav-tab"/>
  <text x="120" y="234" class="text-secondary" text-anchor="middle" font-size="10">FX</text>
  
  <rect x="160" y="220" width="80" height="20" class="nav-tab-active"/>
  <text x="200" y="234" class="text-accent" text-anchor="middle" font-size="10" font-weight="bold">EDIT</text>
  
  <rect x="240" y="220" width="80" height="20" class="nav-tab"/>
  <text x="280" y="234" class="text-secondary" text-anchor="middle" font-size="10">SET</text>
</svg>
