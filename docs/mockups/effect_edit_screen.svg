<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="640" height="480">
  <defs>
    <style>
      .bg { fill: #090B0F; }
      .surface { fill: #121620; }
      .surface-elevated { fill: #191E2A; }
      .header { fill: #121620; }
      
      .text-primary { fill: #F2F5F7; font-family: Arial, sans-serif; font-size: 14px; font-weight: 700; }
      .text-secondary { fill: #A5ADBA; font-family: Arial, sans-serif; font-size: 11px; }
      .text-muted { fill: #687181; font-family: Arial, sans-serif; font-size: 10px; }
      .text-accent { fill: #06B6D4; font-family: Arial, sans-serif; font-size: 11px; font-weight: 600; }
      .text-value { fill: #F2F5F7; font-family: Arial, sans-serif; font-size: 16px; font-weight: 600; }
      
      .slider-bg { fill: #292F3D; }
      .slider-fill { fill: #06B6D4; }
      .slider-knob { fill: #F2F5F7; stroke: #06B6D4; stroke-width: 2; }
      
      .btn-segment { fill: #191E2A; stroke: #292F3D; stroke-width: 1; }
      .btn-segment-active { fill: #06B6D4; stroke: #06B6D4; stroke-width: 1; }
      .btn-toggle-on { fill: #06B6D4; }
      .btn-toggle-off { fill: #292F3D; }
      
      .nav-indicator { fill: #06B6D4; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="320" height="240" class="bg"/>

  <!-- HEADER (28px) - Back + Effect name + ON/OFF toggle -->
  <rect width="320" height="28" class="header"/>
  
  <!-- Back button area -->
  <text x="12" y="18" class="text-secondary" font-size="16">←</text>
  
  <!-- Effect name -->
  <text x="40" y="18" class="text-primary" font-size="14">HARMONY</text>
  
  <!-- ON/OFF Toggle -->
  <rect x="260" y="8" width="50" height="20" rx="10" class="btn-toggle-on"/>
  <circle cx="295" cy="18" r="8" fill="#F2F5F7"/>
  <text x="275" y="21" class="text-primary" font-size="9" font-weight="700">ON</text>

  <!-- PARAMETER 1: INTERVAL -->
  <rect x="8" y="36" width="304" height="56" rx="6" class="surface"/>
  <text x="16" y="54" class="text-secondary" font-size="11" font-weight="600">INTERVAL</text>
  
  <!-- Current value display -->
  <text x="160" y="72" class="text-value" text-anchor="middle">+3rd</text>
  
  <!-- Slider track -->
  <rect x="32" y="80" width="256" height="8" rx="4" class="slider-bg"/>
  <!-- Slider fill -->
  <rect x="32" y="80" width="128" height="8" rx="4" class="slider-fill"/>
  <!-- Slider knob -->
  <circle cx="160" cy="84" r="8" class="slider-knob"/>
  
  <!-- Min/Max labels -->
  <text x="32" y="102" class="text-muted" font-size="9">UNISON</text>
  <text x="288" y="102" class="text-muted" font-size="9" text-anchor="end">OCTAVE</text>

  <!-- PARAMETER 2: LEVEL -->
  <rect x="8" y="100" width="304" height="56" rx="6" class="surface"/>
  <text x="16" y="118" class="text-secondary" font-size="11" font-weight="600">LEVEL</text>
  
  <!-- Current value display -->
  <text x="160" y="136" class="text-value" text-anchor="middle">-9.0 dB</text>
  
  <!-- Slider track -->
  <rect x="32" y="144" width="256" height="8" rx="4" class="slider-bg"/>
  <rect x="32" y="144" width="154" height="8" rx="4" class="slider-fill"/>
  <circle cx="186" cy="148" r="8" class="slider-knob"/>
  
  <!-- Min/Max labels -->
  <text x="32" y="166" class="text-muted" font-size="9">-∞</text>
  <text x="288" y="166" class="text-muted" font-size="9" text-anchor="end">+6dB</text>

  <!-- PARAMETER 3: PAN (Segmented control) -->
  <rect x="8" y="164" width="304" height="44" rx="6" class="surface"/>
  <text x="16" y="182" class="text-secondary" font-size="11" font-weight="600">PAN</text>
  
  <!-- Segmented buttons -->
  <rect x="32" y="188" width="80" height="16" rx="3" class="btn-segment"/>
  <text x="72" y="200" class="text-secondary" text-anchor="middle" font-size="10">LEFT</text>
  
  <rect x="120" y="188" width="80" height="16" rx="3" class="btn-segment-active"/>
  <text x="160" y="200" class="text-primary" text-anchor="middle" font-size="10" font-weight="700">CENTER</text>
  
  <rect x="208" y="188" width="80" height="16" rx="3" class="btn-segment"/>
  <text x="248" y="200" class="text-secondary" text-anchor="middle" font-size="10">RIGHT</text>

  <!-- Page indicator -->
  <text x="160" y="230" class="text-muted" text-anchor="middle" font-size="9">1 / 2</text>

  <!-- NAVIGATION BAR (hidden in edit screens, but shown for consistency) -->
  <rect y="220" width="320" height="20" class="header"/>
  <rect x="80" y="220" width="80" height="3" class="nav-indicator"/>
  <text x="40" y="235" class="text-secondary" text-anchor="middle" font-size="10">PERF</text>
  <text x="120" y="235" class="text-accent" text-anchor="middle" font-size="10" font-weight="700">FX</text>
  <text x="200" y="235" class="text-secondary" text-anchor="middle" font-size="10">PRESET</text>
  <text x="280" y="235" class="text-secondary" text-anchor="middle" font-size="10">SET</text>
</svg>
