<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <style>
    .bg{fill:#090A0E}.surface{fill:#14151B}.elev{fill:#1C1D24}.header{fill:#101116}.nav{fill:#101116}.panel{fill:#202128}
    .t1{fill:#F0EDE5}.t2{fill:#B1ACA3}.tm{fill:#716E69}.tf{fill:#4A4947}
    .acc{fill:#F45126}.accb{fill:#FF6030}.accd{fill:#B83A1C}
    text{font-family:Arial,Helvetica,sans-serif}
  </style>

  <rect width="320" height="240" class="bg"/>

  <!-- HEADER (persistent: back / title / enable) -->
  <rect x="4" y="4" width="312" height="28" rx="3" class="header"/>
  <rect x="10" y="7" width="34" height="24" rx="3" class="surface" stroke="#292A30" stroke-width="1"/>
  <text x="27" y="23" class="t2" font-size="11" text-anchor="middle">&lt;</text>
  <text x="160" y="23" class="t1" font-size="12" font-weight="bold" text-anchor="middle">HARMONY</text>
  <rect x="264" y="7" width="48" height="24" rx="3" class="accd"/>
  <text x="288" y="23" class="t1" font-size="10" text-anchor="middle">ON</text>

  <!-- SECTION: TARGET -->
  <text x="10" y="46" class="tm" font-size="8">TARGET</text>

  <!-- MODE (segmented) -->
  <rect x="4" y="48" width="312" height="44" rx="3" class="surface"/>
  <text x="14" y="62" class="tm" font-size="9">MODE</text>
  <text x="306" y="62" class="accb" font-size="11" text-anchor="end">DIATONIC</text>
  <rect x="14" y="68" width="95" height="22" rx="3" class="panel" stroke="#292A30" stroke-width="1"/>
  <text x="61" y="83" class="t2" font-size="10" text-anchor="middle">FIXED</text>
  <rect x="112" y="68" width="95" height="22" rx="3" class="elev" stroke="#F45126" stroke-width="1"/>
  <text x="159" y="83" class="accb" font-size="10" text-anchor="middle">DIATONIC</text>
  <rect x="210" y="68" width="96" height="22" rx="3" class="panel" stroke="#292A30" stroke-width="1"/>
  <text x="258" y="83" class="t2" font-size="10" text-anchor="middle">MIDI</text>

  <!-- DEGREE (slider) -->
  <rect x="4" y="94" width="312" height="38" rx="3" class="surface"/>
  <text x="14" y="108" class="tm" font-size="9">DEGREE</text>
  <text x="306" y="108" class="t1" font-size="11" text-anchor="end">+2 deg</text>
  <rect x="14" y="115" width="292" height="8" rx="3" class="panel"/>
  <rect x="14" y="115" width="168" height="8" rx="3" class="acc"/>
  <circle cx="182" cy="119" r="6" class="accb"/>

  <!-- KEY (stepper) -->
  <rect x="4" y="134" width="312" height="44" rx="3" class="surface"/>
  <text x="14" y="148" class="tm" font-size="9">KEY</text>
  <rect x="14" y="153" width="44" height="22" rx="3" class="panel" stroke="#292A30" stroke-width="1"/>
  <text x="36" y="168" class="t2" font-size="11" text-anchor="middle">&lt;</text>
  <text x="160" y="169" class="t1" font-size="11" text-anchor="middle">D</text>
  <rect x="262" y="153" width="44" height="22" rx="3" class="panel" stroke="#292A30" stroke-width="1"/>
  <text x="284" y="168" class="t2" font-size="11" text-anchor="middle">&gt;</text>

  <!-- SCALE (stepper, partially visible; body scrolls) -->
  <rect x="4" y="180" width="312" height="44" rx="3" class="surface"/>
  <text x="14" y="194" class="tm" font-size="9">SCALE</text>
  <rect x="14" y="199" width="44" height="22" rx="3" class="panel" stroke="#292A30" stroke-width="1"/>
  <text x="36" y="214" class="t2" font-size="11" text-anchor="middle">&lt;</text>
  <text x="160" y="215" class="t1" font-size="11" text-anchor="middle">DORIAN</text>
  <rect x="262" y="199" width="44" height="22" rx="3" class="panel" stroke="#292A30" stroke-width="1"/>
  <text x="284" y="214" class="t2" font-size="11" text-anchor="middle">&gt;</text>

  <!-- NAVIGATION (FX active) -->
  <rect y="204" width="320" height="36" class="nav"/>
  <rect x="80" y="204" width="80" height="2" class="acc"/>
  <text x="40" y="228" class="tm" font-size="11" text-anchor="middle">PERF</text>
  <text x="120" y="228" class="t1" font-size="11" font-weight="bold" text-anchor="middle">FX</text>
  <text x="200" y="228" class="tm" font-size="11" text-anchor="middle">PRESET</text>
  <text x="280" y="228" class="tm" font-size="11" text-anchor="middle">SET</text>
</svg>
