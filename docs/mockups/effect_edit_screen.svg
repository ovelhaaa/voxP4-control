<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <style>
    .bg{fill:#090A0E}.surface{fill:#14151B}.elev{fill:#1C1D24}.header{fill:#101116}.nav{fill:#101116}.panel{fill:#202128}
    .t1{fill:#F0EDE5}.t2{fill:#B1ACA3}.tm{fill:#716E69}
    .acc{fill:#F45126}.accb{fill:#FF6030}.accd{fill:#B83A1C}
    text{font-family:Arial,Helvetica,sans-serif}
  </style>

  <rect width="320" height="240" class="bg"/>

  <!-- HEADER -->
  <rect x="4" y="4" width="312" height="28" rx="3" class="header"/>
  <rect x="10" y="7" width="32" height="22" rx="3" class="surface" stroke="#292A30" stroke-width="1"/>
  <text x="26" y="22" class="t2" font-size="11" text-anchor="middle">&lt;</text>
  <text x="160" y="23" class="t1" font-size="12" font-weight="bold" text-anchor="middle">HARMONY</text>
  <rect x="266" y="7" width="44" height="22" rx="3" class="accd"/>
  <text x="288" y="22" class="t1" font-size="10" text-anchor="middle">ON</text>

  <!-- PARAMETERS -->
  <text x="10" y="46" class="tm" font-size="8">VOICE 1</text>

  <!-- INTERVAL -->
  <rect x="4" y="48" width="312" height="38" rx="3" class="surface"/>
  <text x="14" y="63" class="tm" font-size="9">INTERVAL</text>
  <text x="306" y="63" class="t1" font-size="11" text-anchor="end">+3rd</text>
  <rect x="14" y="72" width="292" height="8" rx="3" class="panel"/>
  <rect x="14" y="72" width="182" height="8" rx="3" class="acc"/>
  <circle cx="196" cy="76" r="6" class="accb"/>

  <!-- LEVEL -->
  <rect x="4" y="90" width="312" height="38" rx="3" class="surface"/>
  <text x="14" y="105" class="tm" font-size="9">LEVEL</text>
  <text x="306" y="105" class="t1" font-size="11" text-anchor="end">-9.0 dB</text>
  <rect x="14" y="114" width="292" height="8" rx="3" class="panel"/>
  <rect x="14" y="114" width="226" height="8" rx="3" class="acc"/>
  <circle cx="240" cy="118" r="6" class="accb"/>

  <!-- PAN (enum selector) -->
  <rect x="4" y="132" width="312" height="48" rx="3" class="surface"/>
  <text x="14" y="147" class="tm" font-size="9">PAN</text>
  <text x="306" y="147" class="t1" font-size="11" text-anchor="end">C</text>
  <rect x="14" y="152" width="95" height="24" rx="3" class="panel" stroke="#292A30" stroke-width="1"/>
  <text x="61" y="168" class="t2" font-size="11" text-anchor="middle">L</text>
  <rect x="112" y="152" width="95" height="24" rx="3" class="elev" stroke="#F45126" stroke-width="1"/>
  <text x="159" y="168" class="accb" font-size="11" text-anchor="middle">C</text>
  <rect x="210" y="152" width="96" height="24" rx="3" class="panel" stroke="#292A30" stroke-width="1"/>
  <text x="258" y="168" class="t2" font-size="11" text-anchor="middle">R</text>

  <!-- MIX (partially visible, list scrolls) -->
  <rect x="4" y="184" width="312" height="38" rx="3" class="surface"/>
  <text x="14" y="199" class="tm" font-size="9">MIX</text>
  <text x="306" y="199" class="t1" font-size="11" text-anchor="end">65%</text>

  <!-- NAVIGATION (FX active) -->
  <rect y="204" width="320" height="36" class="nav"/>
  <rect x="80" y="204" width="80" height="3" class="acc"/>
  <text x="40" y="228" class="tm" font-size="11" text-anchor="middle">PERF</text>
  <text x="120" y="228" class="t1" font-size="11" font-weight="bold" text-anchor="middle">FX</text>
  <text x="200" y="228" class="tm" font-size="11" text-anchor="middle">PRESET</text>
  <text x="280" y="228" class="tm" font-size="11" text-anchor="middle">SET</text>
</svg>
