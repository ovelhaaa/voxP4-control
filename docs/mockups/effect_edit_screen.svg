<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="640" height="480">
  <defs>
    <!-- VoxP4 Control Surface Design System -->
    <style>
      /* Backgrounds */
      .bg { fill: #090B0F; }
      .surface { fill: #121620; }
      .surface-elevated { fill: #191E2A; }
      .header { fill: #121620; }
      
      /* Text Hierarchy */
      .text-primary { fill: #F2F5F7; font-family: Arial, sans-serif; font-size: 14px; }
      .text-secondary { fill: #A5ADBA; font-family: Arial, sans-serif; font-size: 12px; }
      .text-muted { fill: #687181; font-family: Arial, sans-serif; font-size: 11px; }
      .text-value { fill: #00E5FF; font-family: Arial, sans-serif; font-size: 16px; font-weight: 600; }
      .text-accent { fill: #00E5FF; font-family: Arial, sans-serif; font-size: 13px; }
      
      /* Sliders & Controls */
      .slider-bg { fill: #292F3D; }
      .slider-fill { fill: #00E5FF; }
      .slider-knob { fill: #F2F5F7; }
      
      /* Buttons */
      .btn { fill: #191E2A; stroke: #292F3D; stroke-width: 1; }
      .btn-active { fill: #00E5FF; }
      
      /* Effect Cards */
      .effect-card-active { fill: #191E2A; stroke: #00E5FF; stroke-width: 2; }
      .led-on { fill: #00E5FF; }
      
      /* Navigation */
      .nav-tab { fill: #121620; }
      .nav-indicator { fill: #00E5FF; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="320" height="240" class="bg"/>
  
  <!-- HEADER (28px) with back and toggle -->
  <rect width="320" height="28" class="header"/>
  <text x="10" y="19" class="text-primary" font-size="16">◀</text>
  <text x="30" y="19" class="text-primary" font-size="14" font-weight="700">HARMONY</text>
  
  <!-- ON/OFF Toggle (right side) -->
  <rect x="276" y="8" width="36" height="18" rx="9" class="btn-active"/>
  <circle cx="303" cy="17" r="7" fill="#090B0F"/>
  
  <!-- PARAMETER 1: INTERVAL (54px) -->
  <rect x="8" y="36" width="304" height="54" rx="5" class="surface"/>
  <text x="16" y="54" class="text-secondary" font-size="11" font-weight="600">INTERVAL</text>
  <text x="304" y="54" class="text-value" text-anchor="end" font-size="15">+3rd</text>
  
  <!-- Slider track -->
  <rect x="16" y="62" width="272" height="10" rx="5" class="slider-bg"/>
  <rect x="96" y="62" width="40" height="10" rx="5" class="slider-fill"/>
  <circle cx="136" cy="67" r="6" class="slider-knob"/>
  
  <!-- Min/Max labels -->
  <text x="16" y="84" class="text-muted" font-size="9">-12</text>
  <text x="272" y="84" class="text-muted" font-size="9">+12</text>
  
  <!-- PARAMETER 2: LEVEL (54px) -->
  <rect x="8" y="96" width="304" height="54" rx="5" class="surface"/>
  <text x="16" y="114" class="text-secondary" font-size="11" font-weight="600">LEVEL</text>
  <text x="304" y="114" class="text-value" text-anchor="end" font-size="15">-9.0 dB</text>
  
  <!-- Slider track -->
  <rect x="16" y="122" width="272" height="10" rx="5" class="slider-bg"/>
  <rect x="120" y="122" width="30" height="10" rx="5" class="slider-fill"/>
  <circle cx="150" cy="127" r="6" class="slider-knob"/>
  
  <!-- Min/Max labels -->
  <text x="16" y="144" class="text-muted" font-size="9">-∞</text>
  <text x="272" y="144" class="text-muted" font-size="9">+6</text>
  
  <!-- PARAMETER 3: PAN - Segmented buttons (50px) -->
  <rect x="8" y="156" width="304" height="50" rx="5" class="surface"/>
  <text x="16" y="174" class="text-secondary" font-size="11" font-weight="600">PAN</text>
  
  <!-- Segmented buttons -->
  <rect x="80" y="162" width="60" height="26" rx="4" class="btn"/>
  <text x="110" y="179" class="text-secondary" text-anchor="middle" font-size="9">LEFT</text>
  
  <rect x="146" y="162" width="60" height="26" rx="4" class="btn-active"/>
  <text x="176" y="179" class="text-primary" text-anchor="middle" font-size="9" font-weight="700">CENTER</text>
  
  <rect x="212" y="162" width="60" height="26" rx="4" class="btn"/>
  <text x="242" y="179" class="text-secondary" text-anchor="middle" font-size="9">RIGHT</text>
  
  <!-- Page indicator -->
  <text x="160" y="206" class="text-muted" text-anchor="middle" font-size="10">Page 1/2</text>
  
  <!-- NAVIGATION BAR (20px) -->
  <rect y="220" width="320" height="20" class="header"/>
  
  <!-- Active indicator bar for EDIT tab -->
  <rect x="160" y="220" width="80" height="3" class="nav-indicator"/>
  
  <!-- Tab labels -->
  <text x="40" y="235" class="text-secondary" text-anchor="middle" font-size="10">PERF</text>
  <text x="120" y="235" class="text-secondary" text-anchor="middle" font-size="10">FX</text>
  <text x="200" y="235" class="text-accent" text-anchor="middle" font-size="10" font-weight="700">EDIT</text>
  <text x="280" y="235" class="text-secondary" text-anchor="middle" font-size="10">SET</text>
</svg>
