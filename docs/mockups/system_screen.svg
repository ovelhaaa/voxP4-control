<?xml version="1.0" encoding="UTF-8"?>
<svg width="320" height="240" xmlns="http://www.w3.org/2000/svg">
  <!-- VoxP4 Control Surface - System Screen Mockup -->
  <!-- Design System v2: Professional vocal processor aesthetic -->
  
  <!-- Background -->
  <rect width="320" height="240" fill="#090B0F"/>
  
  <!-- Header (28px) -->
  <rect width="320" height="28" fill="#1E2330"/>
  <text x="12" y="19" font-family="Montserrat" font-size="16" font-weight="600" fill="#F2F5F7">SYSTEM INFO</text>
  
  <!-- VoxLink Section (52px) -->
  <rect x="8" y="36" width="304" height="52" rx="6" fill="#121620"/>
  <text x="16" y="52" font-family="Montserrat" font-size="14" font-weight="600" fill="#06B6D4">VoxLink Status</text>
  <text x="16" y="68" font-family="Montserrat" font-size="12" fill="#A5ADBA">P4 Firmware:</text>
  <text x="200" y="68" font-family="Montserrat" font-size="12" fill="#F2F5F7">1.2.3</text>
  <text x="16" y="82" font-family="Montserrat" font-size="12" fill="#A5ADBA">CYD Firmware:</text>
  <text x="200" y="82" font-family="Montserrat" font-size="12" fill="#F2F5F7">2.1.0</text>
  
  <!-- Audio Section (52px) -->
  <rect x="8" y="92" width="304" height="52" rx="6" fill="#121620"/>
  <text x="16" y="108" font-family="Montserrat" font-size="14" font-weight="600" fill="#06B6D4">Audio</text>
  <text x="16" y="124" font-family="Montserrat" font-size="12" fill="#A5ADBA">Sample Rate:</text>
  <text x="200" y="124" font-family="Montserrat" font-size="12" fill="#F2F5F7">48000 Hz</text>
  <text x="16" y="138" font-family="Montserrat" font-size="12" fill="#A5ADBA">Block Size:</text>
  <text x="200" y="138" font-family="Montserrat" font-size="12" fill="#F2F5F7">64</text>
  
  <!-- Performance Section (52px) -->
  <rect x="8" y="148" width="304" height="52" rx="6" fill="#121620"/>
  <text x="16" y="164" font-family="Montserrat" font-size="14" font-weight="600" fill="#06B6D4">Performance</text>
  <text x="16" y="180" font-family="Montserrat" font-size="12" fill="#A5ADBA">CPU Load:</text>
  <text x="200" y="180" font-family="Montserrat" font-size="12" fill="#F2F5F7">12.5%</text>
  <text x="16" y="194" font-family="Montserrat" font-size="12" fill="#A5ADBA">Underruns:</text>
  <text x="200" y="194" font-family="Montserrat" font-size="12" fill="#F2F5F7">0</text>
  
  <!-- Navigation Bar (36px) at bottom -->
  <rect y="204" width="320" height="36" fill="#1E2330"/>
  
  <!-- Tab PERF -->
  <rect x="0" y="204" width="80" height="36" fill="#1E2330"/>
  <text x="40" y="226" font-family="Montserrat" font-size="12" fill="#A5ADBA" text-anchor="middle">PERF</text>
  
  <!-- Tab FX -->
  <rect x="80" y="204" width="80" height="36" fill="#1E2330"/>
  <text x="120" y="226" font-family="Montserrat" font-size="12" fill="#A5ADBA" text-anchor="middle">FX</text>
  
  <!-- Tab PRESET -->
  <rect x="160" y="204" width="80" height="36" fill="#1E2330"/>
  <text x="200" y="226" font-family="Montserrat" font-size="12" fill="#A5ADBA" text-anchor="middle">PRESET</text>
  
  <!-- Tab SET (active - cyan indicator) -->
  <rect x="240" y="204" width="80" height="36" fill="#1E2330"/>
  <rect x="240" y="204" width="80" height="3" fill="#06B6D4"/>
  <text x="280" y="226" font-family="Montserrat" font-size="12" fill="#F2F5F7" text-anchor="middle">SET</text>
</svg>
