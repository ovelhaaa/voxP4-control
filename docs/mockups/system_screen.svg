<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <style>
    .bg{fill:#090A0E}.header{fill:#101116}.nav{fill:#101116}
    .t1{fill:#F0EDE5}.t2{fill:#B1ACA3}.tm{fill:#716E69}
    .aud{fill:#20D6C7}.acc{fill:#F45126}.accd{fill:#B83A1C}
    text{font-family:Arial,Helvetica,sans-serif}
  </style>

  <rect width="320" height="240" class="bg"/>

  <!-- HEADER -->
  <rect x="4" y="4" width="312" height="24" rx="3" class="header"/>
  <text x="12" y="20.5" class="t1" font-size="13" font-weight="bold">SYSTEM</text>

  <!-- VOXLINK: no backend yet, values are placeholders -->
  <text x="8" y="43" class="aud" font-size="9">VOXLINK</text>
  <text x="8" y="56" class="t2" font-size="10">P4 FW</text>
  <text x="312" y="56" class="tm" font-size="10" text-anchor="end">--</text>
  <text x="8" y="67" class="t2" font-size="10">CYD FW</text>
  <text x="312" y="67" class="tm" font-size="10" text-anchor="end">--</text>

  <!-- AUDIO -->
  <text x="8" y="80" class="aud" font-size="9">AUDIO</text>
  <text x="8" y="92" class="t2" font-size="10">RATE</text>
  <text x="312" y="92" class="tm" font-size="10" text-anchor="end">--</text>
  <text x="8" y="103" class="t2" font-size="10">BLOCK</text>
  <text x="312" y="103" class="tm" font-size="10" text-anchor="end">--</text>

  <!-- PERFORMANCE -->
  <text x="8" y="116" class="t2" font-size="9">PERFORMANCE</text>
  <text x="8" y="128" class="t2" font-size="10">CPU</text>
  <text x="312" y="128" class="tm" font-size="10" text-anchor="end">--</text>
  <text x="8" y="139" class="t2" font-size="10">UNDERRUNS</text>
  <text x="312" y="139" class="tm" font-size="10" text-anchor="end">--</text>

  <!-- COMM -->
  <text x="8" y="152" class="t2" font-size="9">COMM</text>
  <text x="8" y="164" class="t2" font-size="10">UART ERR</text>
  <text x="312" y="164" class="tm" font-size="10" text-anchor="end">--</text>
  <text x="8" y="175" class="t2" font-size="10">CRC ERR</text>
  <text x="312" y="175" class="tm" font-size="10" text-anchor="end">--</text>
  <text x="8" y="186" class="t2" font-size="10">RECONNECT</text>
  <text x="312" y="186" class="tm" font-size="10" text-anchor="end">--</text>

  <!-- SYSTEM (partially visible, body scrolls) -->
  <text x="8" y="199" class="t2" font-size="9">SYSTEM</text>

  <!-- scrollbar hint -->
  <rect x="316" y="36" width="2" height="70" rx="1" class="accd"/>

  <!-- NAVIGATION -->
  <rect y="204" width="320" height="36" class="nav"/>
  <rect x="240" y="204" width="80" height="2" class="acc"/>
  <text x="40" y="228" class="tm" font-size="11" text-anchor="middle">PERF</text>
  <text x="120" y="228" class="tm" font-size="11" text-anchor="middle">FX</text>
  <text x="200" y="228" class="tm" font-size="11" text-anchor="middle">PRESET</text>
  <text x="280" y="228" class="t1" font-size="11" font-weight="bold" text-anchor="middle">SET</text>
</svg>
