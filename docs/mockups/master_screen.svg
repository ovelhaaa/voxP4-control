<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <style>
    .bg{fill:#090A0E}.surface{fill:#14151B}.elev{fill:#1C1D24}.header{fill:#101116}.nav{fill:#101116}.panel{fill:#202128}
    .t1{fill:#F0EDE5}.t2{fill:#B1ACA3}.tm{fill:#716E69}.tf{fill:#4A4947}
    .acc{fill:#F45126}.accb{fill:#FF6030}.accd{fill:#B83A1C}
    text{font-family:Arial,Helvetica,sans-serif}
  </style>

  <rect width="320" height="240" class="bg"/>

  <!-- HEADER: title + TAP TEMPO affordance -->
  <rect x="4" y="4" width="312" height="24" rx="3" class="header"/>
  <text x="12" y="20.5" class="t1" font-size="12" font-weight="bold">MASTER / ROUTING</text>
  <text x="306" y="20" class="accb" font-size="10" font-weight="bold" text-anchor="end">TAP TEMPO</text>

  <!-- TEMPO (global TempoBpm; shared by Delay and Chorus sync) -->
  <rect x="4" y="32" width="312" height="42" rx="3" class="surface"/>
  <text x="14" y="49" class="tm" font-size="9">TEMPO</text>
  <text x="306" y="49" class="t1" font-size="11" text-anchor="end">120 BPM</text>
  <rect x="14" y="57" width="292" height="8" rx="3" class="panel"/>
  <rect x="14" y="57" width="97" height="8" rx="3" class="acc"/>
  <circle cx="111" cy="61" r="6" class="accb"/>

  <!-- MASTER LIMITER CEILING (no enable parameter exists) -->
  <rect x="4" y="78" width="312" height="42" rx="3" class="surface"/>
  <text x="14" y="95" class="tm" font-size="9">LIMITER CEILING</text>
  <text x="306" y="95" class="t1" font-size="11" text-anchor="end">-0.4 dB</text>
  <rect x="14" y="103" width="292" height="8" rx="3" class="panel"/>
  <rect x="14" y="103" width="276" height="8" rx="3" class="acc"/>
  <circle cx="290" cy="107" r="6" class="accb"/>

  <!-- MUTE DRY -->
  <rect x="4" y="124" width="312" height="36" rx="3" class="surface"/>
  <text x="14" y="145" class="tm" font-size="9">MUTE DRY</text>
  <rect x="248" y="129" width="56" height="26" rx="3" class="surface" stroke="#292A30" stroke-width="1"/>
  <text x="276" y="146" class="tm" font-size="10" text-anchor="middle">OFF</text>

  <!-- SPATIAL ROUTING (Parallel / DelayIntoReverb) -->
  <rect x="4" y="164" width="312" height="42" rx="3" class="surface"/>
  <text x="14" y="178" class="tm" font-size="9">SPATIAL ROUTING</text>
  <rect x="14" y="184" width="143" height="22" rx="3" class="panel" stroke="#292A30" stroke-width="1"/>
  <text x="85" y="199" class="t2" font-size="10" text-anchor="middle">PARALLEL</text>
  <rect x="161" y="184" width="143" height="22" rx="3" class="elev" stroke="#F45126" stroke-width="1"/>
  <text x="232" y="199" class="accb" font-size="10" text-anchor="middle">DLY&gt;REV</text>

  <!-- SPATIAL SOURCE (Input / PostDynamics / PostHarmony) continues below the fold -->

  <!-- NAVIGATION (SET active) -->
  <rect y="204" width="320" height="36" class="nav"/>
  <rect x="240" y="204" width="80" height="2" class="acc"/>
  <text x="40" y="228" class="tm" font-size="11" text-anchor="middle">PERF</text>
  <text x="120" y="228" class="tm" font-size="11" text-anchor="middle">FX</text>
  <text x="200" y="228" class="tm" font-size="11" text-anchor="middle">PRESET</text>
  <text x="280" y="228" class="t1" font-size="11" font-weight="bold" text-anchor="middle">SET</text>
</svg>
