<?xml version="1.0" encoding="UTF-8"?>
<svg width="320" height="240" viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg">
  <!-- VoxP4 CYD - Footswitch Configuration Screen Mockup -->
  
  <!-- Background -->
  <rect width="320" height="240" fill="#121212"/>
  
  <!-- Header Bar -->
  <rect width="320" height="32" fill="#2A2A3A"/>
  <text x="160" y="22" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">FOOTSWITCH CONFIG</text>
  
  <!-- FS1 Section -->
  <rect x="10" y="42" width="145" height="90" fill="#1E1E2E" stroke="#3A3A4A" stroke-width="1" rx="6"/>
  
  <!-- FS1 Header -->
  <rect x="10" y="42" width="145" height="24" fill="#2A2A3A" rx="6"/>
  <text x="82" y="59" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">FS1</text>
  
  <!-- FS1 Mode Label -->
  <text x="20" y="82" font-family="Arial, sans-serif" font-size="11" fill="#B0B0B0">Mode:</text>
  
  <!-- FS1 Mode Toggle (Latching) -->
  <rect x="70" y="72" width="75" height="20" fill="#4A90D9" rx="4"/>
  <text x="107" y="86" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">LATCHING</text>
  
  <!-- FS1 Action Label -->
  <text x="20" y="108" font-family="Arial, sans-serif" font-size="11" fill="#B0B0B0">Action:</text>
  <text x="20" y="122" font-family="Arial, sans-serif" font-size="10" fill="#64B5F6">Harmony Toggle</text>
  
  <!-- FS1 LED Indicator -->
  <circle cx="140" cy="52" r="5" fill="#00E676"/>
  
  <!-- FS2 Section -->
  <rect x="165" y="42" width="145" height="90" fill="#1E1E2E" stroke="#3A3A4A" stroke-width="1" rx="6"/>
  
  <!-- FS2 Header -->
  <rect x="165" y="42" width="145" height="24" fill="#2A2A3A" rx="6"/>
  <text x="237" y="59" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">FS2</text>
  
  <!-- FS2 Mode Label -->
  <text x="175" y="82" font-family="Arial, sans-serif" font-size="11" fill="#B0B0B0">Mode:</text>
  
  <!-- FS2 Mode Toggle (Momentary) -->
  <rect x="225" y="72" width="75" height="20" fill="#424242" rx="4"/>
  <text x="262" y="86" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#B0B0B0" text-anchor="middle">MOMENT.</text>
  
  <!-- FS2 Action Label -->
  <text x="175" y="108" font-family="Arial, sans-serif" font-size="11" fill="#B0B0B0">Action:</text>
  <text x="175" y="122" font-family="Arial, sans-serif" font-size="10" fill="#64B5F6">Reverb Toggle</text>
  
  <!-- FS2 LED Indicator (OFF) -->
  <circle cx="295" cy="52" r="5" fill="#424242"/>
  
  <!-- Action Buttons Row -->
  <rect x="10" y="142" width="300" height="60" fill="#1E1E2E" stroke="#3A3A4A" stroke-width="1" rx="6"/>
  
  <!-- Edit Button -->
  <rect x="20" y="152" width="85" height="40" fill="#4A90D9" rx="6"/>
  <text x="62" y="177" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">EDIT FS1</text>
  
  <!-- Edit Button -->
  <rect x="115" y="152" width="85" height="40" fill="#4A90D9" rx="6"/>
  <text x="157" y="177" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">EDIT FS2</text>
  
  <!-- Test Button -->
  <rect x="210" y="152" width="90" height="40" fill="#424242" stroke="#64B5F6" stroke-width="1" rx="6"/>
  <text x="255" y="177" font-family="Arial, sans-serif" font-size="12" fill="#64B5F6" text-anchor="middle">TEST MODE</text>
  
  <!-- Navigation Bar -->
  <rect y="208" width="320" height="32" fill="#2A2A3A"/>
  
  <!-- Nav Buttons -->
  <rect x="0" y="208" width="64" height="32" fill="none"/>
  <text x="32" y="230" font-family="Arial, sans-serif" font-size="11" fill="#B0B0B0" text-anchor="middle">⮌ BACK</text>
  
  <rect x="64" y="208" width="64" height="32" fill="none"/>
  <text x="96" y="230" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">PERF</text>
  
  <rect x="128" y="208" width="64" height="32" fill="none"/>
  <text x="160" y="230" font-family="Arial, sans-serif" font-size="11" fill="#B0B0B0" text-anchor="middle">CHAIN</text>
  
  <rect x="192" y="208" width="64" height="32" fill="none"/>
  <text x="224" y="230" font-family="Arial, sans-serif" font-size="11" fill="#B0B0B0" text-anchor="middle">PRESET</text>
  
  <rect x="256" y="208" width="64" height="32" fill="none"/>
  <text x="288" y="230" font-family="Arial, sans-serif" font-size="11" fill="#B0B0B0" text-anchor="middle">SYS</text>
  
  <!-- Visual indicator of footswitches at bottom -->
  <circle cx="100" cy="225" r="8" fill="#00E676" opacity="0.5"/>
  <text x="100" y="250" font-family="Arial, sans-serif" font-size="9" fill="#00E676" text-anchor="middle">FS1</text>
  
  <circle cx="220" cy="225" r="8" fill="#424242" opacity="0.5"/>
  <text x="220" y="250" font-family="Arial, sans-serif" font-size="9" fill="#424242" text-anchor="middle">FS2</text>
</svg>
