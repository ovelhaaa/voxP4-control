<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="640" height="480">
  <defs>
    <style>
      .bg { fill: #090B0F; }
      .surface { fill: #121620; }
      .surface-elevated { fill: #191E2A; }
      .header { fill: #121620; }
      .text-primary { fill: #F2F5F7; font-family: Arial, sans-serif; font-size: 14px; }
      .text-secondary { fill: #A5ADBA; font-family: Arial, sans-serif; font-size: 12px; }
      .text-muted { fill: #687181; font-family: Arial, sans-serif; font-size: 11px; }
      .text-accent { fill: #00E5FF; font-family: Arial, sans-serif; font-size: 14px; }
      .preset-row { fill: #191E2A; }
      .preset-selected { fill: #00E5FF; }
      .preset-current-indicator { fill: #121620; stroke: #00E5FF; stroke-width: 1; }
      .btn-load { fill: #4CAF50; }
      .btn-save { fill: #2196F3; }
      .btn-delete { fill: #F44336; }
      .nav-tab { fill: #121620; }
      .nav-tab-active { fill: #191E2A; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="320" height="240" class="bg"/>
  
  <!-- HEADER (28px) -->
  <rect width="320" height="28" class="header"/>
  <text x="10" y="19" class="text-primary" font-size="14" font-weight="bold">PRESETS</text>
  
  <!-- Current Preset Indicator (32px) -->
  <rect x="8" y="36" width="304" height="32" rx="6" class="preset-current-indicator"/>
  <text x="16" y="56" class="text-secondary" font-size="11">CURRENT:</text>
  <text x="90" y="56" class="text-accent" font-size="13" font-weight="bold">P03 Lead Air</text>
  
  <!-- Preset List (120px) -->
  <rect x="8" y="74" width="304" height="120" rx="6" class="surface"/>
  
  <!-- Preset rows (28px each) -->
  <rect x="12" y="78" width="296" height="26" rx="4" class="preset-row"/>
  <text x="20" y="96" class="text-primary" font-size="12">P01 Clean Warm</text>
  
  <rect x="12" y="106" width="296" height="26" rx="4" class="preset-row"/>
  <text x="20" y="124" class="text-primary" font-size="12">P02 Bright Chorus</text>
  
  <rect x="12" y="134" width="296" height="26" rx="4" class="preset-selected"/>
  <text x="20" y="152" class="text-primary" font-size="12" font-weight="bold">P03 Lead Air</text>
  
  <rect x="12" y="162" width="296" height="26" rx="4" class="preset-row"/>
  <text x="20" y="180" class="text-primary" font-size="12">P04 Heavy Harmony</text>
  
  <rect x="12" y="190" width="296" height="26" rx="4" class="preset-row"/>
  <text x="20" y="208" class="text-primary" font-size="12">P05 Ambient Pad</text>
  
  <!-- Scroll indicator -->
  <text x="160" y="206" class="text-muted" text-anchor="middle" font-size="9">▼ More presets...</text>
  
  <!-- Action Buttons Row (36px) -->
  <rect x="8" y="200" width="304" height="36" rx="6" class="surface"/>
  
  <!-- LOAD Button (primary action) -->
  <rect x="16" y="206" width="84" height="24" rx="4" class="btn-load"/>
  <text x="58" y="222" class="text-primary" text-anchor="middle" font-size="11" font-weight="bold">LOAD</text>
  
  <!-- SAVE AS Button -->
  <rect x="108" y="206" width="84" height="24" rx="4" class="btn-save"/>
  <text x="150" y="222" class="text-primary" text-anchor="middle" font-size="11">SAVE AS</text>
  
  <!-- DELETE Button (secondary, smaller) -->
  <rect x="200" y="206" width="104" height="24" rx="4" class="btn-delete"/>
  <text x="252" y="222" class="text-primary" text-anchor="middle" font-size="11">DELETE</text>
  
  <!-- NAVIGATION BAR (20px) -->
  <rect y="220" width="320" height="20" class="header"/>
  
  <rect x="0" y="220" width="80" height="20" class="nav-tab"/>
  <text x="40" y="234" class="text-secondary" text-anchor="middle" font-size="10">PERF</text>
  
  <rect x="80" y="220" width="80" height="20" class="nav-tab"/>
  <text x="120" y="234" class="text-secondary" text-anchor="middle" font-size="10">FX</text>
  
  <rect x="160" y="220" width="80" height="20" class="nav-tab-active"/>
  <text x="200" y="234" class="text-accent" text-anchor="middle" font-size="10" font-weight="bold">PRESET</text>
  
  <rect x="240" y="220" width="80" height="20" class="nav-tab"/>
  <text x="280" y="234" class="text-secondary" text-anchor="middle" font-size="10">SET</text>
</svg>
