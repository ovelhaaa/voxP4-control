<?xml version="1.0" encoding="UTF-8"?>
<svg width="240" height="320" viewBox="0 0 240 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="320" fill="#121212"/>
  
  <!-- Header -->
  <rect width="240" height="32" fill="#2A2A3A"/>
  <text x="8" y="21" font-family="Arial" font-size="16" fill="white" font-weight="bold">PRESET MANAGER</text>
  
  <!-- Current Preset Row -->
  <rect x="8" y="40" width="224" height="28" rx="8" fill="#1E1E2E"/>
  <text x="16" y="59" font-family="Arial" font-size="12" fill="#B0B0B0">CURRENT:</text>
  <text x="140" y="59" font-family="Arial" font-size="14" fill="#64B5F6" font-weight="bold">P03 Lead Air</text>
  
  <!-- Preset List Container -->
  <rect x="8" y="74" width="224" height="120" rx="8" fill="#1E1E2E"/>
  
  <!-- Preset Items -->
  <rect x="12" y="80" width="216" height="24" rx="4" fill="#2A2A3A"/>
  <text x="20" y="96" font-family="Arial" font-size="12" fill="white">P01 Clean Warm</text>
  
  <rect x="12" y="106" width="216" height="24" rx="4" fill="#2A2A3A"/>
  <text x="20" y="122" font-family="Arial" font-size="12" fill="white">P02 Bright Chorus</text>
  
  <rect x="12" y="132" width="216" height="24" rx="4" fill="#64B5F6"/>
  <text x="20" y="148" font-family="Arial" font-size="12" fill="black" font-weight="bold">P03 Lead Air</text>
  
  <rect x="12" y="158" width="216" height="24" rx="4" fill="#2A2A3A"/>
  <text x="20" y="174" font-family="Arial" font-size="12" fill="white">P04 Heavy Harmony</text>
  
  <rect x="12" y="184" width="216" height="24" rx="4" fill="#2A2A3A"/>
  <text x="20" y="200" font-family="Arial" font-size="12" fill="white">P05 Ambient Pad</text>
  
  <!-- Scroll indicator (faded items below) -->
  <text x="20" y="224" font-family="Arial" font-size="12" fill="#707070">P06 Studio Vocal...</text>
  
  <!-- Action Buttons Row -->
  <rect x="8" y="202" width="224" height="40" fill="#121212"/>
  
  <!-- LOAD Button -->
  <rect x="16" y="208" width="90" height="36" rx="8" fill="#4CAF50"/>
  <text x="61" y="231" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="bold">LOAD</text>
  
  <!-- SAVE AS Button -->
  <rect x="75" y="208" width="90" height="36" rx="8" fill="#2196F3"/>
  <text x="120" y="231" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="bold">SAVE AS</text>
  
  <!-- DELETE Button -->
  <rect x="134" y="208" width="90" height="36" rx="8" fill="#EF5350"/>
  <text x="179" y="231" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="bold">DELETE</text>
  
  <!-- Navigation Bar -->
  <rect y="288" width="240" height="32" fill="#2A2A3A"/>
  <rect x="192" y="288" width="48" height="32" fill="#1E1E2E"/>
  <text x="24" y="309" font-family="Arial" font-size="10" fill="#B0B0B0" text-anchor="middle">PERF</text>
  <text x="72" y="309" font-family="Arial" font-size="10" fill="#B0B0B0" text-anchor="middle">CHAIN</text>
  <text x="120" y="309" font-family="Arial" font-size="10" fill="#B0B0B0" text-anchor="middle">EDIT</text>
  <text x="168" y="309" font-family="Arial" font-size="10" fill="#B0B0B0" text-anchor="middle">FS</text>
  <text x="216" y="309" font-family="Arial" font-size="10" fill="white" font-weight="bold" text-anchor="middle">PRESETS</text>
