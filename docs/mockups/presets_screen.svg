<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <style>
    .bg{fill:#090A0E}.surface{fill:#14151B}.elev{fill:#1C1D24}.header{fill:#101116}.nav{fill:#101116}
    .t1{fill:#F0EDE5}.t2{fill:#B1ACA3}.tm{fill:#716E69}
    .acc{fill:#F45126}.accb{fill:#FF6030}.accd{fill:#B83A1C}
    text{font-family:Arial,Helvetica,sans-serif}
  </style>

  <rect width="320" height="240" class="bg"/>

  <!-- HEADER -->
  <rect x="4" y="4" width="312" height="24" rx="3" class="header"/>
  <text x="12" y="20.5" class="t1" font-size="13" font-weight="bold">PRESETS</text>

  <!-- CURRENT PRESET -->
  <rect x="4" y="32" width="312" height="28" rx="3" class="elev" stroke="#B83A1C" stroke-width="1"/>
  <text x="12" y="50" class="tm" font-size="9">CURRENT</text>
  <text x="306" y="50" class="acc" font-size="11" text-anchor="end">P03  LEAD AIR</text>

  <!-- PRESET LIST -->
  <rect x="4" y="64" width="312" height="22" rx="3" class="surface" stroke="#292A30" stroke-width="1"/>
  <text x="14" y="79" class="tm" font-size="9">01</text>
  <text x="38" y="79" class="t2" font-size="11">CLEAN WARM</text>

  <rect x="4" y="88" width="312" height="22" rx="3" class="surface" stroke="#292A30" stroke-width="1"/>
  <text x="14" y="103" class="tm" font-size="9">02</text>
  <text x="38" y="103" class="t2" font-size="11">BRIGHT CHORUS</text>

  <rect x="4" y="112" width="312" height="22" rx="3" class="elev" stroke="#B83A1C" stroke-width="1"/>
  <rect x="4" y="118" width="3" height="11" rx="1.5" class="acc"/>
  <text x="14" y="127" class="tm" font-size="9">03</text>
  <text x="38" y="127" class="accb" font-size="11">LEAD AIR</text>

  <rect x="4" y="136" width="312" height="22" rx="3" class="surface" stroke="#292A30" stroke-width="1"/>
  <text x="14" y="151" class="tm" font-size="9">04</text>
  <text x="38" y="151" class="t2" font-size="11">HEAVY HARMONY</text>

  <!-- scrollbar hint -->
  <rect x="316" y="66" width="2" height="40" rx="1" class="accd"/>

  <!-- ACTIONS (secondary) -->
  <rect x="4" y="168" width="101" height="32" rx="3" fill="none" stroke="#F45126" stroke-width="1"/>
  <text x="54" y="188" class="accb" font-size="11" text-anchor="middle">LOAD</text>

  <rect x="109" y="168" width="101" height="32" rx="3" fill="none" stroke="#34343C" stroke-width="1"/>
  <text x="159" y="188" class="t2" font-size="11" text-anchor="middle">SAVE AS</text>

  <rect x="214" y="168" width="102" height="32" rx="3" fill="none" stroke="#34343C" stroke-width="1"/>
  <text x="265" y="188" class="t2" font-size="11" text-anchor="middle">DELETE</text>

  <!-- NAVIGATION -->
  <rect y="204" width="320" height="36" class="nav"/>
  <rect x="160" y="204" width="80" height="3" class="acc"/>
  <text x="40" y="228" class="tm" font-size="11" text-anchor="middle">PERF</text>
  <text x="120" y="228" class="tm" font-size="11" text-anchor="middle">FX</text>
  <text x="200" y="228" class="t1" font-size="11" font-weight="bold" text-anchor="middle">PRESET</text>
  <text x="280" y="228" class="tm" font-size="11" text-anchor="middle">SET</text>
</svg>
